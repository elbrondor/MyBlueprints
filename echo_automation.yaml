# =============================================================================
# echo_automation.yaml
#
# VERSION: 1.6.0
# =============================================================================

blueprint:
  name: EchoAutomation V1.6.0
  description: >
    Startet bei Bewegung oder Belegung einen Radiosender auf einem Amazon
    Echo. Bei unerwuenschtem Programm wird stattdessen ein alternativer
    Sprachbefehl ausgefuehrt. Wechselt das laufende Radioprogramm spaeter zu
    einem unerwuenschten Beitrag, wird ebenfalls automatisch gewechselt. Bei
    anhaltender Inaktivitaet wird die Wiedergabe beendet. Kehrt ein Echo nach
    einem Verbindungsverlust zurueck, wird bei weiterhin erkannter Aktivitaet
    der Start erneut geprueft.
  domain: automation
  author: Jonny.S@gmx.de
  source_url: https://github.com/elbrondor/MyBlueprints/blob/master/echo_automation.yaml
  homeassistant:
    min_version: "2026.7.0"

  input:
    devices:
      name: Bereich und Echo
      icon: mdi:amazon-alexa
      input:
        activity_area:
          name: Bereich fuer Bewegung und Belegung
          description: Aktivitaet in diesem Bereich startet die Wiedergabe.
          default: kuche
          selector:
            area: {}
        echo_player:
          name: Amazon Echo
          description: Echo, auf dem Radio oder die alternative Musik laeuft.
          default: media_player.echo_kuche
          selector:
            entity:
              filter:
                - domain: media_player
        group_player:
          name: Uebergeordneter Echo-Gruppenplayer
          description: >
            Solange dieser Player laeuft, wird der einzelne Echo weder
            automatisch gestartet noch gestoppt.
          default: media_player.uberall
          selector:
            entity:
              filter:
                - domain: media_player
        program_sensor:
          name: Aktuelles Radioprogramm
          description: Entitaet, deren Zustand den aktuell laufenden Beitrag enthaelt.
          default: sensor.jetzt_in_bayern_1
          selector:
            entity:
              filter:
                - domain: sensor
        announcement_script:
          name: Ansage-Script
          description: >
            Script fuer die Sprachausgabe. Der Ansagetext wird als Variable
            "message" uebergeben.
          default: script.notify_alexa_kuche
          selector:
            entity:
              filter:
                - domain: script

    playback:
      name: Wiedergabe
      icon: mdi:radio
      input:
        radio_command:
          name: Radio-an-Befehl
          description: Sprachbefehl fuer die erste Wiedergabe auf dem Echo.
          default: Spiel Bayern eins
          selector:
            text: {}
        alternative_command:
          name: Alternativer Musikbefehl
          description: Wird bei einem unerwuenschten Radioprogramm abgespielt.
          default: Spiele Musik, die mir gefällt, von Spotify in zufälliger Reihenfolge
          selector:
            text:
              multiline: true
        spotify_busy_command:
          name: Alternative bei bereits laufendem Spotify
          description: >
            Wird statt des Spotify-Befehls ausgefuehrt, wenn Spotify bereits
            auf einem der ausgewaehlten Player laeuft.
          default: Spiel Bayern 2
          selector:
            text: {}
        spotify_players:
          name: Player fuer die Spotify-Pruefung
          description: >
            Echo-Player, auf denen eine laufende Spotify-Wiedergabe erkannt
            werden soll. Ohne Auswahl wird Spotify nicht geprueft.
          default: []
          selector:
            entity:
              filter:
                - domain: media_player
              multiple: true
        radio_media_title:
          name: Titel des laufenden Radiosenders
          description: >
            Wert des Attributs media_title, an dem eine laufende
            Radio-Wiedergabe erkannt wird.
          default: BR1 - Oberbayern
          selector:
            text: {}
        unwanted_programs:
          name: Unerwuenschte Programme
          description: Liste der Programmnamen, bei denen zur Alternative gewechselt wird.
          default:
            - Bayern 1 Heute im Stadion
            - Evangelische Morgenfeier
            - Katholische Morgenfeier
          selector:
            object: {}
        startup_volume:
          name: Einschaltlautstaerke
          description: >
            Wird beim ersten automatischen Start eines Kalendertags gesetzt.
            Weitere Starts am selben Tag veraendern die Lautstaerke nicht.
          default: 30
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        startup_volume_timestamp:
          name: Zeitstempel fuer die Einschaltlautstaerke
          description: >
            Optionaler Input-Datetime-Helfer mit Datum und Uhrzeit. Er speichert,
            wann die Einschaltlautstaerke zuletzt gesetzt wurde. Ohne Helfer ist
            die taegliche Lautstaerkeregelung deaktiviert.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime

    restrictions:
      name: Einschaltbedingungen
      icon: mdi:play-circle-outline
      collapsed: true
      input:
        blocking_entities:
          name: Sperr-Entitaeten
          description: Die Wiedergabe startet nur, wenn alle Entitaeten ausgeschaltet sind.
          default:
            - input_boolean.abwesend_urlaub
            - input_boolean.gastemodus
            - input_boolean.home_office
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: switch
              multiple: true
        active_after:
          name: Aktiv ab
          default: "05:00:00"
          selector:
            time: {}
        active_before:
          name: Aktiv bis
          default: "20:30:00"
          selector:
            time: {}
        group_idle_duration:
          name: Mindest-Ruhezeit des Gruppenplayers
          description: >
            Der Gruppenplayer muss mindestens so lange inaktiv sein, bevor
            der Echo automatisch startet.
          default:
            minutes: 10
          selector:
            duration: {}
        blind_time:
          name: Blindzeit zwischen Automationslaeufen
          description: >
            Neue Ausloeser werden ohne Aktion beendet, wenn der vorherige
            Automationslauf weniger als diese Anzahl Sekunden zurueckliegt.
          default: 60
          selector:
            number:
              min: 1
              max: 600
              step: 1
              unit_of_measurement: s
              mode: slider

    shutoff:
      name: Ausschaltverhalten
      icon: mdi:stop-circle-outline
      collapsed: true
      input:
        shutoff_blocking_entities:
          name: Ausschalt-Sperr-Entitaeten
          description: >
            Die Wiedergabe wird nur gestoppt, wenn alle ausgewaehlten
            Entitaeten ausgeschaltet sind.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: switch
              multiple: true
        inactivity_trigger_duration:
          name: Nachlaufzeit
          description: Wartezeit nach dem Ende eines Aktivitaetssignals.
          default: 5
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider
        inactivity_confirmation_duration:
          name: Bestaetigte Inaktivitaet
          description: >
            Vor dem Stoppen muessen alle Bewegungs- und Belegungssensoren
            mindestens so lange inaktiv sein.
          default:
            minutes: 3
          selector:
            duration: {}

mode: restart
max_exceeded: silent

variables:
  echo_player: !input echo_player
  program_sensor: !input program_sensor
  radio_command: !input radio_command
  alternative_command: !input alternative_command
  spotify_busy_command: !input spotify_busy_command
  spotify_players: !input spotify_players
  spotify_is_playing: >
    {% set ns = namespace(active=false) %}
    {% for player in expand(spotify_players) %}
      {% set picture = player.attributes.entity_picture | default('', true) %}
      {% if player.state == 'playing' and 'scdn.co' in picture %}
        {% set ns.active = true %}
      {% endif %}
    {% endfor %}
    {{ ns.active }}
  selected_alternative_command: >
    {{ spotify_busy_command if spotify_is_playing | bool else alternative_command }}
  startup_volume: !input startup_volume
  startup_volume_timestamp: !input startup_volume_timestamp
  blind_time: !input blind_time

triggers:
  - id: activity_detected
    trigger: motion.detected
    target:
      area_id: !input activity_area
    options:
      behavior: each
  - id: activity_detected
    trigger: occupancy.detected
    target:
      area_id: !input activity_area
    options:
      behavior: each
  - id: echo_online
    trigger: state
    entity_id: !input echo_player
    from: unavailable
  - id: echo_online
    trigger: state
    entity_id: !input echo_player
    from: unknown
  - id: activity_cleared
    trigger: motion.cleared
    target:
      area_id: !input activity_area
    options:
      behavior: each
      for:
        minutes: !input inactivity_trigger_duration
  - id: activity_cleared
    trigger: occupancy.cleared
    target:
      area_id: !input activity_area
    options:
      behavior: each
      for:
        minutes: !input inactivity_trigger_duration
  - id: stop_safety_check
    trigger: time_pattern
    minutes: "/5"
  - id: program_check
    trigger: state
    entity_id: !input program_sensor
  - id: program_check
    trigger: media_player.started_playing
    target:
      entity_id: !input echo_player
    options:
      behavior: each

actions:
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none or
         (now() - this.attributes.last_triggered).total_seconds() >= (blind_time | float(60)) }}
  - condition: template
    value_template: "{{ has_value(echo_player) }}"
  - choose:
      - alias: Bei Aktivitaet Wiedergabe starten
        conditions:
          - condition: trigger
            id:
              - activity_detected
              - echo_online
          - condition: or
            conditions:
              - condition: motion.is_detected
                target:
                  area_id: !input activity_area
                options:
                  behavior: any
              - condition: occupancy.is_detected
                target:
                  area_id: !input activity_area
                options:
                  behavior: any
          - condition: state
            entity_id: !input blocking_entities
            state: "off"
          - condition: time
            after: !input active_after
            before: !input active_before
          - condition: media_player.is_not_playing
            target:
              entity_id: !input group_player
            options:
              behavior: any
              for: !input group_idle_duration
          - condition: media_player.is_not_playing
            target:
              entity_id: !input echo_player
            options:
              behavior: any
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ startup_volume_timestamp != '' and
                     states(startup_volume_timestamp)[:10] != now().strftime('%Y-%m-%d') }}
            then:
              - action: media_player.volume_set
                target:
                  entity_id: !input echo_player
                data:
                  volume_level: "{{ (startup_volume | float(30) / 100) | round(2) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: !input startup_volume_timestamp
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - choose:
              - alias: Unerwuenschtes Programm direkt ueberspringen
                conditions:
                  - condition: state
                    entity_id: !input program_sensor
                    state: !input unwanted_programs
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input announcement_script
                    data:
                      variables:
                        message: >
                          {% if spotify_is_playing | bool %}
                            Oh je, jetzt wuerde {{ states(program_sensor) }} laufen.
                            Spotify laeuft bereits auf einem anderen Geraet.
                            Ich starte stattdessen die Radio-Alternative.
                          {% else %}
                            Oh je, jetzt wuerde {{ states(program_sensor) }} laufen.
                            Ich starte lieber Musik von Spotify.
                          {% endif %}
                  - action: media_player.play_media
                    target:
                      entity_id: !input echo_player
                    data:
                      media:
                        media_content_id: "{{ selected_alternative_command }}"
                        media_content_type: custom
                        metadata: {}
            default:
              - action: script.turn_on
                target:
                  entity_id: !input announcement_script
                data:
                  variables:
                    message: >
                      In Bayern 1 laeuft gerade {{ states(program_sensor) }}.
                      Das schalte ich an.
              - action: media_player.play_media
                target:
                  entity_id: !input echo_player
                data:
                  media:
                    media_content_id: "{{ radio_command }}"
                    media_content_type: custom
                    metadata: {}

      - alias: Bei anhaltender Inaktivitaet Wiedergabe stoppen
        conditions:
          - condition: trigger
            id:
              - activity_cleared
              - stop_safety_check
          - condition: media_player.is_not_playing
            target:
              entity_id: !input group_player
            options:
              behavior: any
          - condition: state
            entity_id: !input shutoff_blocking_entities
            state: "off"
          - condition: media_player.is_playing
            target:
              entity_id: !input echo_player
            options:
              behavior: any
          - condition: motion.is_not_detected
            target:
              area_id: !input activity_area
            options:
              behavior: all
              for: !input inactivity_confirmation_duration
          - condition: occupancy.is_not_detected
            target:
              area_id: !input activity_area
            options:
              behavior: all
              for: !input inactivity_confirmation_duration
        sequence:
          - action: media_player.media_stop
            target:
              entity_id: !input echo_player

      - alias: Laufendes unerwuenschtes Programm wechseln
        conditions:
          - condition: trigger
            id: program_check
          - condition: media_player.is_playing
            target:
              entity_id: !input echo_player
            options:
              behavior: any
          - condition: state
            entity_id: !input echo_player
            attribute: media_title
            state: !input radio_media_title
          - condition: state
            entity_id: !input program_sensor
            state: !input unwanted_programs
        sequence:
          - action: script.turn_on
            target:
              entity_id: !input announcement_script
            data:
              variables:
                message: >
                  {% if spotify_is_playing | bool %}
                    In Bayern 1 laeuft gerade {{ states(program_sensor) }}.
                    Spotify laeuft bereits auf einem anderen Geraet.
                    Darum starte ich die Radio-Alternative.
                  {% else %}
                    In Bayern 1 laeuft gerade {{ states(program_sensor) }}.
                    Darum spiele ich lieber Musik auf Spotify.
                  {% endif %}
          - action: media_player.play_media
            target:
              entity_id: !input echo_player
            data:
              media:
                media_content_id: "{{ selected_alternative_command }}"
                media_content_type: custom
                metadata: {}
