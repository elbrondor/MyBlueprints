blueprint:
  name: Automatisches Licht mit Sperrzeiten
  description: >
    Schaltet ausgewaehlte Licht- und Schalter-Entitaeten bei Bewegung ein und
    nach ausbleibender Bewegung wieder aus. Ein optionaler Zeitplan und ein
    optionaler IsDark-Sensor sowie eine Sperr-Entitaet sperren nur das
    automatische Einschalten.
    Das Ausschalten bleibt jederzeit aktiv. Eine manuelle Bedienung kann die
    Automatik fuer eine konfigurierbare Dauer pausieren und den geschalteten
    Lichtzustand beibehalten.
  domain: automation
  author: Jonny.S@gmx.de
  source_url: https://github.com/elbrondor/MyBlueprints/blob/master/AutomaticLight.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    devices:
      name: Bereich und Lichtaktoren
      icon: mdi:lightbulb-auto
      input:
        motion_area:
          name: Bereich fuer Bewegung
          description: Alle Bewegungsmelder dieses Bereichs werden beruecksichtigt.
          selector:
            area: {}
        controlled_entities:
          name: Zu schaltende Entitaeten
          description: Licht- und Schalter-Entitaeten, die gemeinsam geschaltet werden.
          selector:
            entity:
              filter:
                - domain: light
                - domain: switch
              multiple: true
    restrictions:
      name: Einschaltbedingungen
      icon: mdi:lightbulb-off-outline
      input:
        blocking_entity:
          name: Sperr-Entitaet
          description: Wenn diese Entitaet eingeschaltet ist, wird das Licht nicht automatisch eingeschaltet.
          default: input_boolean.abwesend_urlaub
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: switch
        blocking_schedule:
          name: Sperrzeiten
          description: Optional. Solange der Zeitplan aktiv ist, wird nicht automatisch eingeschaltet.
          default: ""
          selector:
            entity:
              domain: schedule
        darkness_entity:
          name: Helligkeit aussen (IsDark)
          description: Optional. Bei leerem Feld wird unabhaengig von der Helligkeit eingeschaltet. Der Sensor muss bei Dunkelheit "on" sein.
          default: ""
          selector:
            entity:
              domain: binary_sensor
    override:
      name: Manuelle Uebersteuerung
      description: >
        Eine Zustandsaenderung an einem ausgewaehlten Shelly-Eingang pausiert
        die Lichtautomatik. Der manuell geschaltete Lichtzustand bleibt fuer
        die konfigurierte Dauer unveraendert.
      icon: mdi:hand-back-right
      collapsed: true
      input:
        manual_override_entities:
          name: Lokale Lichtschalter
          description: Shelly-Eingaenge, deren Zustandsaenderung als manuelle Bedienung gilt.
          default: []
          selector:
            entity:
              domain: binary_sensor
              multiple: true
        manual_override_duration:
          name: Dauer der Uebersteuerung
          description: Jede erneute manuelle Bedienung startet diese Zeit neu.
          default: 15
          selector:
            number:
              min: 1
              max: 180
              step: 1
              unit_of_measurement: min
              mode: box
    timing:
      name: Ausschaltverhalten
      icon: mdi:timer-outline
      collapsed: true
      input:
        automatic_off_delay:
          name: Nachleuchtzeit
          description: So lange muss im gesamten Bereich keine Bewegung erkannt worden sein, bevor ausgeschaltet wird.
          default:
            minutes: 5
          selector:
            duration: {}
        safety_no_motion:
          name: Mindestzeit ohne Bewegung fuer Sicherheitspruefung
          description: Wird fuer die Pruefung eines manuell eingeschalteten Lichts verwendet.
          default:
            minutes: 3
          selector:
            duration: {}

mode: restart
max_exceeded: silent

variables:
  controlled_entities: !input controlled_entities
  blocking_entity: !input blocking_entity
  blocking_schedule: !input blocking_schedule
  darkness_entity: !input darkness_entity
  manual_override_entities: !input manual_override_entities
  manual_override_duration: !input manual_override_duration
  manual_override: >
    {% set ns = namespace(active=false) %}
    {% set duration = (manual_override_duration | int(15)) * 60 %}
    {% for entity in manual_override_entities %}
      {% if states[entity] is defined %}
        {% if (now() - states[entity].last_changed).total_seconds() < duration %}
          {% set ns.active = true %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.active }}

triggers:
  - id: motion_detected
    trigger: motion.detected
    target:
      area_id: !input motion_area
    options:
      behavior: each
  - id: motion_cleared
    trigger: motion.cleared
    target:
      area_id: !input motion_area
    options:
      behavior: all
      for: !input automatic_off_delay
  - id: safety_check
    trigger: time_pattern
    minutes: "/5"
  - id: manual_override
    trigger: state
    entity_id: !input manual_override_entities

actions:
  - if:
      - condition: template
        value_template: "{{ manual_override | bool }}"
    then:
      - stop: >
          Manuelle Uebersteuerung aktiv. Der aktuelle Lichtzustand bleibt
          fuer die konfigurierte Dauer unveraendert.
  - choose:
      - alias: Bei Bewegung einschalten
        conditions:
          - condition: trigger
            id: motion_detected
          - condition: template
            value_template: "{{ controlled_entities | length > 0 }}"
          - condition: template
            value_template: "{{ not blocking_entity or not is_state(blocking_entity, 'on') }}"
          - condition: template
            value_template: "{{ not blocking_schedule or not is_state(blocking_schedule, 'on') }}"
          - condition: template
            value_template: "{{ not darkness_entity or is_state(darkness_entity, 'on') }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ controlled_entities }}"
      - alias: Ohne Bewegung ausschalten
        conditions:
          - condition: trigger
            id:
              - motion_cleared
              - safety_check
          - condition: template
            value_template: "{{ controlled_entities | length > 0 }}"
          - condition: motion.is_not_detected
            target:
              area_id: !input motion_area
            options:
              behavior: all
              for: !input safety_no_motion
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ controlled_entities }}"
