blueprint:
  name: s42 - Intelligente Rollladensteuerung V2 (ein Rollladen pro Automation)
  description: "Steuert einen einzelnen Rollladen anhand \"seines\" Fensters: morgendliches
    Öffnen, Reaktion auf gekippte/geöffnete Fenster inkl. Rückfahr-Logik, Nachtmodus,
    Sturmschutz, automatische Beschattung anhand des Sonnenstands (Sonnenschutz, optional
    mit Filter nach Wetterlage), Sonnenheizen (das Gegenteil: öffnet in der Heizperiode
    heruntergelassene/vergessene Rollläden bei Sonne und Kälte) sowie ein Moskito-Modus,
    der beim Öffnen des Fensters nach Sonnenuntergang die Lichter im Raum ausschaltet.\n\nPro
    Fenster/Rollladen wird eine eigene Automation aus diesem Blueprint erstellt. Gemeinsame
    Helfer (z.B. das input_datetime für morgens oder der Nachtmodus-Helfer) werden
    einfach in allen Instanzen identisch ausgewählt.\n\n\U0001F4D6 [Ausführliche Dokumentation
    & FAQ](https://github.com/TheRealSimon42/ha-blueprints/blob/main/docs/cover_automation_v2.md)\n"
  domain: automation
  author: TheRealSimon42
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/TheRealSimon42/ha-blueprints/blob/main/automations/cover_automation_v2.yaml
  input:
    assignment_section:
      name: Zuordnung
      description: Der Rollladen und der zugehörige Fenstersensor.
      icon: mdi:vector-link
      input:
        cover:
          name: Rollladen
          description: Der Rollladen, den diese Automation steuert.
          selector:
            entity:
              domain:
              - cover
              multiple: false
              reorder: false
        window_sensor:
          name: Fenstersensor
          description: 'Der Fensterkontakt zu diesem Rollladen. Unterstützt werden
            klassische binäre Fensterkontakte (offen/geschlossen) ebenso wie Drei-Zustands-Sensoren
            mit offen/gekippt/geschlossen. Hinweis: Binäre Kontakte erscheinen in
            der Auswahl nur mit passender Geräteklasse (Tür, Fenster, Öffnung oder
            Garagentor) — die lässt sich in den Einstellungen der Entität nachrüsten.

            '
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
                device_class:
                - door
                - window
                - opening
                - garage_door
              - domain:
                - sensor
              multiple: false
              reorder: false
    morning_section:
      name: Morgens öffnen
      description: Einstellungen für das automatische Öffnen am Morgen.
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_enabled:
          name: Morgens öffnen aktivieren
          default: true
          selector:
            boolean: {}
        morning_time:
          name: Uhrzeit für morgendliches Hochfahren
          description: 'Ein input_datetime-Helfer mit der Uhrzeit für das Hochfahren
            (erforderlich, wenn "Morgens öffnen" aktiviert ist). Wichtig: einen Helfer,
            der NUR eine Uhrzeit enthält (ohne Datum) — ein Datum+Uhrzeit-Helfer feuert
            nur ein einziges Mal an genau diesem Datum und danach nie wieder. In allen
            Blueprint-Instanzen denselben Helfer auswählen.

            '
          default: []
          selector:
            entity:
              domain:
              - input_datetime
              multiple: false
              reorder: false
        morning_position:
          name: Zielposition für morgens
          description: 'Die Position (in %), auf die der Rollladen morgens fährt.
            Es wird nur gefahren, wenn der Rollladen geschlossener ist als diese Position.

            '
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
    window_interaction_section:
      name: Fenster-Interaktion
      description: Wie der Rollladen auf geöffnete oder gekippte Fenster reagiert.
      icon: mdi:window-open-variant
      collapsed: true
      input:
        tilted_position:
          name: Zielposition für gekipptes Fenster
          description: 'Die Position (in %), auf die der Rollladen fährt, wenn das
            Fenster gekippt wird. Es wird nur gefahren, wenn der Rollladen geschlossener
            ist.

            '
          default: 20
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        reclose_timeout:
          name: Zeitfenster für automatisches Zurückfahren
          description: 'Wird das Fenster innerhalb dieser Zeit wieder geschlossen,
            fährt der Rollladen in seine Ausgangsposition zurück.

            '
          default: 30
          selector:
            number:
              min: 1.0
              max: 120.0
              step: 1.0
              mode: slider
              unit_of_measurement: Minuten
        force_close:
          name: Schließen erzwingen
          description: 'Wenn aktiviert, wird der Rollladen nach Ablauf des Zeitfensters
            immer geschlossen, auch wenn das Fenster noch offen ist. ⚠️ Achtung: Aussperr-Gefahr!

            '
          default: false
          selector:
            boolean: {}
        treat_open_as_tilted:
          name: Öffnen wie Kippen behandeln
          description: 'Für Fenster mit einfachem binärem Kontakt (nur offen/geschlossen),
            die im Alltag praktisch immer nur gekippt werden — z.B. das Badfenster.
            Wenn aktiviert, wird jedes "offen" wie "gekippt" behandelt: Der Rollladen
            fährt beim Öffnen auf die Kipp-Position statt komplett auf, auch der Nachtmodus
            nutzt die Kipp-Position, und die Beschattung läuft weiter (mit der Kipp-Position
            als Lüftungsspalt), statt bei offenem Fenster zu pausieren. Benachrichtigungen
            melden weiterhin "offen" — das entspricht dem, was der Sensor tatsächlich
            sieht.

            '
          default: false
          selector:
            boolean: {}
    window_geometry_section:
      name: Fenstergeometrie & Sonnenausrichtung
      description: 'Ausrichtung und Sichtfeld des Fensters. Diese Werte bestimmen,
        wann die Sonne geometrisch "ins Fenster scheint" — sowohl für den Sonnenschutz
        (Beschattung) als auch für Sonnenheizen. Wird nur eines der beiden Features
        genutzt, müssen die Werte trotzdem hier gesetzt werden.


        Zur Bedeutung von Ausrichtung und Sichtfeld:

        ![Erklärgrafik Sichtfeld](https://cdn.jsdelivr.net/gh/TheRealSimon42/ha-blueprints@main/images/sichtfeld_beschattung.svg)

        '
      icon: mdi:sun-compass
      collapsed: true
      input:
        window_azimuth:
          name: Ausrichtung des Fensters
          description: 'Himmelsrichtung, in die das Fenster zeigt, in Grad (0 = Nord,
            90 = Ost, 180 = Süd, 270 = West).

            '
          default: 180
          selector:
            number:
              min: 0.0
              max: 359.0
              step: 1.0
              mode: slider
              unit_of_measurement: °
        shading_fov_left:
          name: Sichtfeld links
          description: 'Wie weit die Sonne seitlich links von der Fensterausrichtung
            stehen darf und noch als "scheint ins Fenster" gilt. 90° ist das geometrische
            Maximum — die Sonne steht dann genau in der Fassadenebene und kann das
            Fenster gerade noch treffen. Nur verkleinern, wenn auf dieser Seite ein
            Hindernis die Sonne blockiert (tiefe Laibung, Balkon, Nachbarhaus). Links/rechts
            gilt von innen am Fenster stehend mit Blick nach draußen — bei einem Südfenster
            ist links die Vormittagsseite (Osten).

            '
          default: 90
          selector:
            number:
              min: 0.0
              max: 90.0
              step: 1.0
              mode: slider
              unit_of_measurement: °
        shading_fov_right:
          name: Sichtfeld rechts
          description: 'Wie Sichtfeld links, nur rechts der Fensterausrichtung — bei
            einem Südfenster die Nachmittags-/Abendseite (Westen).

            '
          default: 90
          selector:
            number:
              min: 0.0
              max: 90.0
              step: 1.0
              mode: slider
              unit_of_measurement: °
        shading_min_elevation:
          name: Minimale Sonnenhöhe
          description: 'Unterhalb dieser Sonnenhöhe (Elevation in Grad) gilt die Sonne
            als nicht "im Fenster" (weder für Sonnenschutz noch für Sonnenheizen),
            z.B. weil Nachbargebäude oder Bäume die tiefe Sonne ohnehin blockieren.

            '
          default: 0
          selector:
            number:
              min: 0.0
              max: 45.0
              step: 1.0
              mode: slider
              unit_of_measurement: °
    shading_section:
      name: Sonnenschutz (Beschattung)
      description: 'Fährt den Rollladen anhand des Sonnenstands automatisch so weit
        herunter, dass die Sonne höchstens bis zur eingestellten Tiefe in den Raum
        scheint — und wieder hoch, sobald die Sonne nicht mehr ins Fenster scheint
        oder es abgekühlt ist. Sehr schräg einfallende Sonne wird dabei automatisch
        berücksichtigt: je flacher der Winkel, desto weiter oben bleibt der Rollladen.
        Wird der Rollladen während der Beschattung manuell verfahren, erkennt die
        Automation das und lässt ihn bis zum Beschattungs-Ende in Ruhe. Ausrichtung
        und Sichtfeld werden im Abschnitt "Fenstergeometrie & Sonnenausrichtung" eingestellt.
        ⚠️ Benötigt einen eigenen input_boolean-Helfer pro Fenster als Status-Speicher.

        '
      icon: mdi:sun-wireless
      collapsed: true
      input:
        shading_enabled:
          name: Sonnenschutz aktivieren
          description: 'Benötigt zwingend den Status-Helfer (nächstes Feld) sowie
            die Werte im Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der
            Helfer, erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.

            '
          default: false
          selector:
            boolean: {}
        shading_status_helper:
          name: Status-Helfer (input_boolean)
          description: 'Erforderlich für den Sonnenschutz: ein input_boolean-Helfer
            NUR für dieses Fenster. Er merkt sich, ob die Beschattung aktiv ist, damit
            der Rollladen danach zuverlässig wieder geöffnet wird (auch über Neustarts
            hinweg).

            '
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              multiple: false
              reorder: false
        shading_weather_states:
          name: Wetterlagen für Beschattung (optional)
          description: 'Beschattet wird nur, wenn die Wetter-Entität (siehe Sturmschutz
            weiter unten) eine dieser Wetterlagen meldet — praktisch, um z.B. bei
            "bewölkt" trotz rechnerisch passendem Sonnenstand nicht unnötig zu beschatten.
            Leer lassen, um die Wetterlage zu ignorieren (Standardverhalten wie bisher
            — nur Sonnenstand und Temperatur zählen). Ohne gesetzte Wetter-Entität
            wird dieser Filter ignoriert, auch wenn hier Werte ausgewählt sind.

            '
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
              - value: sunny
                label: ☀️ Sonnig
              - value: partlycloudy
                label: ⛅ Teilweise bewölkt
              - value: cloudy
                label: ☁️ Bewölkt
              - value: clear-night
                label: "\U0001F319 Klare Nacht"
              - value: fog
                label: "\U0001F32B️ Nebel"
              - value: windy
                label: "\U0001F4A8 Windig"
              - value: windy-variant
                label: "\U0001F4A8 Windig mit Wolken"
              - value: rainy
                label: "\U0001F327️ Regnerisch"
              - value: pouring
                label: "\U0001F327️ Starkregen"
              - value: lightning
                label: ⛈️ Gewitter
              - value: lightning-rainy
                label: ⛈️ Gewitter mit Regen
              - value: hail
                label: "\U0001F328️ Hagel"
              - value: snowy
                label: ❄️ Schnee
              - value: snowy-rainy
                label: "\U0001F328️ Schneeregen"
              - value: exceptional
                label: ⚠️ Außergewöhnlich
              custom_value: false
              sort: false
        window_height:
          name: Fensterhöhe
          description: Höhe der Glasfläche in Metern.
          default: 1.3
          selector:
            number:
              min: 0.3
              max: 3.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        window_sill_height:
          name: Brüstungshöhe
          description: Höhe der Fensterunterkante über dem Fußboden in Metern (bei
            bodentiefen Fenstern 0).
          default: 0.9
          selector:
            number:
              min: 0.0
              max: 2.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        shading_depth:
          name: Maximale Sonneneinfall-Tiefe
          description: 'Wie weit die Sonne maximal in den Raum scheinen darf (auf
            dem Fußboden gemessen, ab Fensterebene). Kleinere Werte = strengere Beschattung;
            bei sehr kleinen Werten fährt der Rollladen praktisch komplett zu.

            '
          default: 1.0
          selector:
            number:
              min: 0.0
              max: 3.0
              step: 0.1
              mode: box
              unit_of_measurement: m
        glass_bottom_position:
          name: Aufsetz-Punkt (Glas-Kalibrierung)
          description: 'Die Position (in %), bei der der Panzer gerade auf Fensterbank
            oder Boden aufsitzt und das Glas komplett abgedeckt ist — darunter schließen
            sich nur noch die Lamellen. Zum Ermitteln den Rollladen langsam herunterfahren,
            bis der Lichtspalt unten gerade verschwindet, und die Position ablesen.
            Mit gesetztem Wert rechnet die Beschattung in echter Glasfläche und fährt
            nie tiefer als diesen Punkt — die Lamellen bleiben offen. 0 = Motor-Position
            wird direkt als Glasfläche interpretiert (bisheriges Verhalten).

            '
          default: 0
          selector:
            number:
              min: 0.0
              max: 50.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        glass_top_position:
          name: Oberer Glas-Endpunkt (Glas-Kalibrierung)
          description: 'Die Position (in %), bei der das Glas gerade komplett frei
            ist — darüber wird der Panzer nur noch in den Kasten eingezogen. Meist
            nahe 100 und deutlich unwichtiger als der Aufsetz-Punkt. Muss über dem
            Aufsetz-Punkt liegen, sonst wird die Kalibrierung ignoriert.

            '
          default: 100
          selector:
            number:
              min: 50.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        shading_min_position:
          name: Minimale Beschattungsposition
          description: 'Tiefer als diese Position fährt die Beschattung nicht (z.B.
            10 %, damit immer etwas Tageslicht bleibt). 0 = ganz schließen erlaubt.

            '
          default: 0
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        shading_end_position:
          name: Position nach der Beschattung
          description: Position, auf die nach Ende der Beschattung gefahren wird.
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        shading_temp_sensor:
          name: Außentemperatur-Sensor (optional)
          description: 'Optionaler Temperatursensor für die Beschattungs-Bedingung.
            Wenn leer, wird die Temperatur der Wetter-Entität aus dem Sturmschutz
            verwendet — eines von beiden muss gesetzt sein, sonst startet die Beschattung
            nie.

            '
          default: []
          selector:
            entity:
              domain:
              - sensor
              device_class:
              - temperature
              multiple: false
              reorder: false
        shading_temp_threshold:
          name: Temperatur-Schwelle
          description: Beschattet wird nur, wenn die Außentemperatur über diesem Wert
            liegt.
          default: 25
          selector:
            number:
              min: 10.0
              max: 40.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_temp_hysteresis:
          name: Temperatur-Hysterese
          description: 'Die Beschattung endet erst, wenn die Temperatur um diesen
            Wert unter die Schwelle gefallen ist (verhindert ständiges Auf und Ab).

            '
          default: 2
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_min_change:
          name: Minimale Positionsänderung
          description: 'Der Rollladen wird beim Nachführen nur bewegt, wenn sich die
            Zielposition um mindestens diesen Wert von der aktuellen unterscheidet
            (schont den Motor).

            '
          default: 5
          selector:
            number:
              min: 1.0
              max: 25.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        shading_override_threshold:
          name: Toleranz für manuelle Eingriffe
          description: 'Weicht die Ist-Position während laufender Beschattung um mehr
            als diesen Wert von der berechneten Sollposition ab, wertet die Automation
            das als manuellen Eingriff und lässt den Rollladen in Ruhe — bis die Beschattung
            endet und normal wieder geöffnet wird. Kleinere Abweichungen gelten als
            normales Nachführen der Sonne.

            '
          default: 20
          selector:
            number:
              min: 10.0
              max: 60.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        force_shading:
          name: Beschattung erzwingen
          description: 'Wenn aktiviert, wird auch bei komplett geöffnetem Fenster
            beschattet — praktisch, damit es nicht aufheizt, wenn man das Fenster
            mal vergisst. Als Lüftungsspalt bleibt dabei mindestens die Kipp-Position
            stehen. ⚠️ Achtung: Für Balkon- und Terrassentüren nicht empfohlen — Aussperr-Gefahr!

            '
          default: false
          selector:
            boolean: {}
    solar_heating_section:
      name: Sonnenheizen (Winter)
      description: 'Das Gegenteil des Sonnenschutzes: Öffnet einen heruntergelassenen
        (z.B. vergessenen) Rollladen automatisch, wenn die Sonne laut Sonnenstand
        ins Fenster scheint und es draußen kalt ist — damit die Sonne kostenlos beim
        Aufheizen des Raums hilft. Nutzt dieselbe Fensterausrichtung/Sichtfeld wie
        der Sonnenschutz (Abschnitt "Fenstergeometrie & Sonnenausrichtung"), läuft
        aber unabhängig davon, ob der Sonnenschutz selbst aktiviert ist. Der Sturmschutz
        hat immer Vorrang — bei Starkwind greift Sonnenheizen nicht. ⚠️ Benötigt einen
        EIGENEN input_boolean-Helfer (nicht denselben wie der Sonnenschutz-Helfer!).

        '
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        solar_heating_enabled:
          name: Sonnenheizen aktivieren
          description: 'Benötigt zwingend den Status-Helfer (nächstes Feld) sowie
            die Werte im Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der
            Helfer, erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.

            '
          default: false
          selector:
            boolean: {}
        solar_heating_status_helper:
          name: Status-Helfer (input_boolean)
          description: 'Erforderlich für Sonnenheizen: ein eigener input_boolean-Helfer
            NUR für dieses Fenster (separat vom Sonnenschutz-Helfer). Verhindert,
            dass ein manuell wieder heruntergelassener Rollladen im selben Zeitraum
            erneut aufgedrängt wird — erst wenn die Bedingungen (Sonne/Temperatur)
            einmal enden und neu eintreten, öffnet Sonnenheizen wieder.

            '
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              multiple: false
              reorder: false
        solar_heating_temp_threshold:
          name: Temperatur-Schwelle
          description: 'Sonnenheizen greift nur, wenn die Außentemperatur unter diesem
            Wert liegt (Heizperiode). Nutzt denselben Temperatursensor bzw. dieselbe
            Wetter-Entität wie der Sonnenschutz (Außentemperatur-Sensor bzw. Wetter-Entität
            aus dem Sturmschutz-Abschnitt). ⚠️ Sollte deutlich unter der Beschattungs-Temperatur-Schwelle
            liegen, damit sich Sonnenschutz und Sonnenheizen bei überlappenden Werten
            nicht widersprechen (gleichzeitig schließen und öffnen wollen).

            '
          default: 12
          selector:
            number:
              min: -10.0
              max: 20.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_temp_hysteresis:
          name: Temperatur-Hysterese
          description: 'Sonnenheizen endet erst, wenn die Temperatur um diesen Wert
            über die Schwelle gestiegen ist (verhindert ständiges Auf und Ab).

            '
          default: 2
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_min_position:
          name: Grenzwert "heruntergelassen"
          description: 'Der Rollladen gilt erst unterhalb dieser Position als "heruntergelassen"
            und wird nur dann durch Sonnenheizen geöffnet (verhindert unnötiges Nachfahren
            bei einem bereits fast offenen Rollladen).

            '
          default: 50
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
        solar_heating_position:
          name: Zielposition
          description: 'Position (in %), auf die der Rollladen beim Sonnenheizen geöffnet
            wird.

            '
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
    mosquito_section:
      name: Moskito-Modus
      description: 'Schaltet die Lichter im Raum aus, wenn das Fenster nach Einbruch
        der Dunkelheit geöffnet oder gekippt wird — damit das Licht keine Insekten
        anlockt.

        '
      icon: mdi:bug
      collapsed: true
      input:
        mosquito_enabled:
          name: Moskito-Modus aktivieren
          default: false
          selector:
            boolean: {}
        mosquito_area:
          name: Bereich (optional)
          description: 'Der Bereich, dessen Lichter ausgeschaltet werden. Wenn leer,
            wird automatisch der Bereich des Fenstersensors verwendet.

            '
          default: ''
          selector:
            area:
              multiple: false
              reorder: false
        mosquito_exclude:
          name: Ausnahmen
          description: 'Diese Lichter bleiben an (z.B. eine rote Stehlampe fürs Baby).

            '
          default: []
          selector:
            entity:
              domain:
              - light
              multiple: true
              reorder: false
        mosquito_after_time:
          name: Frühestens ab (optional)
          description: 'Zusätzliche Zeitbedingung: Der Moskito-Modus greift erst ab
            dieser Uhrzeit (und nur, wenn die Sonne unter dem Horizont ist). 00:00:00
            = keine Einschränkung.

            '
          default: 00:00:00
          selector:
            time: {}
    night_mode_section:
      name: Nachtmodus
      description: Schließen der Rollläden bei Nacht über einen gemeinsamen Helfer.
      icon: mdi:weather-night
      collapsed: true
      input:
        night_mode_boolean:
          name: Nachtmodus-Helfer (optional)
          description: 'Ein input_boolean-Helfer. Wird er eingeschaltet, fährt der
            Rollladen für die Nacht herunter. Leer lassen, wenn kein Nachtmodus gewünscht
            ist. In allen Blueprint-Instanzen denselben Helfer auswählen.

            '
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              multiple: false
              reorder: false
        night_ventilation_position:
          name: Nachtposition bei offenem Fenster
          description: 'Position (in %), auf die nachts gefahren wird, wenn das Fenster
            komplett offen ist. Bei gekipptem Fenster wird die Kipp-Position verwendet.

            '
          default: 15
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: '%'
    storm_protection_section:
      name: Sturmschutz
      description: Fährt den Rollladen bei starkem Wind hoch (oder im Panzer-Modus
        herunter).
      icon: mdi:weather-windy
      collapsed: true
      input:
        storm_enabled:
          name: Sturmschutz aktivieren
          description: Benötigt eine Wetter-Entität oder einen Wind-Sensor (unten
            auswählen).
          default: false
          selector:
            boolean: {}
        weather_entity:
          name: Wetter-Entität
          description: 'Deine Wetter-Entität (z.B. von DWD oder der Standard-Integration).
            Für den Sturmschutz wird ihr wind_speed-Attribut verwendet, sofern kein
            Wind-Sensor gesetzt ist; außerdem dient sie als Temperatur-Fallback für
            den Sonnenschutz.

            '
          default: []
          selector:
            entity:
              domain:
              - weather
              multiple: false
              reorder: false
        storm_wind_sensor:
          name: Wind-Sensor (optional)
          description: 'Alternativ zur Wetter-Entität: ein Sensor mit Windgeschwindigkeit,
            z.B. der Böen-Sensor deiner Wetterstation (Böen sind für den Sturmschutz
            meist aussagekräftiger als der Mittelwind). Wenn gesetzt, hat er Vorrang
            vor der Wetter-Entität.

            '
          default: []
          selector:
            entity:
              domain:
              - sensor
              device_class:
              - wind_speed
              multiple: false
              reorder: false
        wind_speed_threshold:
          name: Windgeschwindigkeit-Grenzwert
          description: 'Ab dieser Windgeschwindigkeit wird der Sturmschutz ausgelöst
            (ca. 55 km/h empfohlen). Wichtig: Der Wert wird direkt mit dem Sensorwert
            bzw. dem wind_speed-Attribut der Wetter-Entität verglichen — liefert deine
            Quelle m/s oder mph statt km/h, muss der Grenzwert entsprechend umgerechnet
            werden.

            '
          default: 55
          selector:
            number:
              min: 30.0
              max: 120.0
              step: 1.0
              mode: slider
              unit_of_measurement: km/h
        panzer_mode:
          name: Panzer-Modus
          description: Wenn aktiviert, wird der Rollladen bei Sturm geschlossen statt
            geöffnet.
          default: false
          selector:
            boolean: {}
        force_storm_action:
          name: Aktion bei Sturm erzwingen
          description: 'Wenn aktiviert, wird der Rollladen bei Sturm auch bewegt,
            wenn das Fenster offen ist. ⚠️ Achtung: Aussperr-Gefahr!

            '
          default: false
          selector:
            boolean: {}
    pause_section:
      name: Pausieren
      description: 'Hält die Automation vorübergehend komplett an — z.B. während einer
        Videoaufnahme (Licht!), wenn Gäste im Zimmer schlafen oder der Fensterputzer
        da ist.

        '
      icon: mdi:pause-circle
      collapsed: true
      input:
        pause_boolean:
          name: Pausier-Helfer (optional)
          description: 'Ein oder mehrere input_boolean-Helfer, die die Automatik anhalten
            — keine Fahrten, keine Lichter, keine Meldungen. Ob dafür der ein- oder
            ausgeschaltete Zustand zählt, legst du im nächsten Feld fest; bei mehreren
            Helfern pausiert die Automatik nur, wenn ALLE gleichzeitig im Pausier-Zustand
            sind. Zwei Ausnahmen: Der Sturmschutz greift weiterhin (Hardware-Schutz
            geht vor), und der "Rollladen schließen"-Knopf einer Benachrichtigung
            funktioniert wie der Wandtaster — bewusste Befehle werden nicht blockiert.
            Beim Ende der Pause wird ein inzwischen aktiver Nachtmodus nachgeholt
            und die Beschattung neu bewertet; verpasste Einzelereignisse (z.B. das
            morgendliche Öffnen oder das Zurückfahren nach dem Lüften) werden nicht
            nachgeholt.

            '
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              multiple: true
              reorder: false
        pause_mode:
          name: Logik des Pausier-Helfers
          description: 'Gilt für alle ausgewählten Pausier-Helfer gemeinsam. "AN pausiert"
            passt zu Helfern wie "Aufnahme läuft" — pausiert wird, wenn alle eingeschaltet
            sind. "AUS pausiert" macht die Helfer zu Aktiv-Schaltern fürs Dashboard
            (z.B. "Rollladensteuerung aktiv") — pausiert wird, wenn alle ausgeschaltet
            sind; sobald einer an ist, läuft die Automatik.

            '
          default: on_pauses
          selector:
            select:
              mode: list
              options:
              - value: on_pauses
                label: Helfer AN = Automatik pausiert (z.B. "Aufnahme läuft")
              - value: off_pauses
                label: Helfer AUS = Automatik pausiert (z.B. "Rollladensteuerung aktiv")
              multiple: false
              custom_value: false
              sort: false
    notification_section:
      name: Benachrichtigungen
      description: 'Benachrichtigungen bei zu lange offenem oder gekipptem Fenster.
        Wird das Fenster geschlossen, verschwindet die Meldung automatisch vom Gerät.

        '
      icon: mdi:bell
      collapsed: true
      input:
        notification_device:
          name: Benachrichtigungs-Geräte
          description: Geräte mit der Home Assistant Companion App. Leer = keine Benachrichtigungen.
          default: []
          selector:
            device:
              multiple: true
              filter:
              - integration: mobile_app
        notification_timeout:
          name: Benachrichtigung nach X Min. (Fenster offen)
          default: 45
          selector:
            number:
              min: 5.0
              max: 240.0
              step: 1.0
              mode: slider
              unit_of_measurement: Minuten
        notification_timeout_tilted:
          name: Benachrichtigung nach X Min. (Fenster gekippt)
          default: 60
          selector:
            number:
              min: 5.0
              max: 480.0
              step: 1.0
              mode: slider
              unit_of_measurement: Minuten
        use_area_name:
          name: Bereichsnamen in Benachrichtigungen verwenden
          description: Wenn aktiviert, wird der Bereichsname (z.B. "Wohnzimmer") statt
            des Sensor-Namens verwendet.
          default: false
          selector:
            boolean: {}
        sleep_mode_boolean:
          name: Schlafmodus-Helfer (optional)
          description: Wenn dieser input_boolean 'on' ist, werden keine Benachrichtigungen
            gesendet.
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              multiple: false
              reorder: false
mode: parallel
max: 20
variables:
  cover_entity: !input cover
  window_sensor: !input window_sensor
  tilted_position: !input tilted_position
  reclose_timeout: !input reclose_timeout
  force_close: !input force_close
  treat_open_as_tilted: !input treat_open_as_tilted
  morning_position: !input morning_position
  night_mode_boolean: !input night_mode_boolean
  night_ventilation_position: !input night_ventilation_position
  storm_enabled: !input storm_enabled
  weather_entity: !input weather_entity
  storm_wind_sensor: !input storm_wind_sensor
  wind_speed_threshold: !input wind_speed_threshold
  panzer_mode: !input panzer_mode
  force_storm_action: !input force_storm_action
  shading_status_helper: !input shading_status_helper
  window_azimuth: !input window_azimuth
  shading_fov_left: !input shading_fov_left
  shading_fov_right: !input shading_fov_right
  shading_min_elevation: !input shading_min_elevation
  window_height: !input window_height
  window_sill_height: !input window_sill_height
  shading_depth: !input shading_depth
  glass_bottom_position: !input glass_bottom_position
  glass_top_position: !input glass_top_position
  shading_min_position: !input shading_min_position
  shading_end_position: !input shading_end_position
  shading_temp_sensor: !input shading_temp_sensor
  shading_temp_threshold: !input shading_temp_threshold
  shading_temp_hysteresis: !input shading_temp_hysteresis
  shading_min_change: !input shading_min_change
  shading_override_threshold: !input shading_override_threshold
  force_shading: !input force_shading
  shading_weather_states: !input shading_weather_states
  solar_heating_status_helper: !input solar_heating_status_helper
  solar_heating_temp_threshold: !input solar_heating_temp_threshold
  solar_heating_temp_hysteresis: !input solar_heating_temp_hysteresis
  solar_heating_min_position: !input solar_heating_min_position
  solar_heating_position: !input solar_heating_position
  mosquito_area_input: !input mosquito_area
  mosquito_exclude: !input mosquito_exclude
  pause_boolean: !input pause_boolean
  pause_mode: !input pause_mode
  pause_active: "{% set helpers = [pause_boolean] if pause_boolean is string else
    pause_boolean %} {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off'
    %} {% set found = expand(helpers) | list %} {{ helpers | length > 0\n   and found
    | length > 0\n   and found | rejectattr('state', 'eq', pausing) | list | length
    == 0 }}"
  sleep_mode_boolean: !input sleep_mode_boolean
  use_area_name: !input use_area_name
  notification_timeout: !input notification_timeout
  notification_timeout_tilted: !input notification_timeout_tilted
  notification_device: !input notification_device
  action_id: '{{ ''CLOSE_SHUTTER__'' ~ window_sensor }}'
  notification_tag: '{{ ''fenster_offen_'' ~ (window_sensor | slugify) }}'
  device_name_map: "{% set ns = namespace(device_names=[]) %} {% for device_id in
    notification_device %}\n  {% set device_name = device_attr(device_id, \"name\")
    %}\n  {% if device_name %}\n    {% set ns.device_names = ns.device_names + [\"mobile_app_\"
    + device_name | slugify] %}\n  {% endif %}\n{% endfor %} {{ ns.device_names }}\n"
trigger_variables:
  window_sensor_tv: !input window_sensor
triggers:
- trigger: time
  at: !input morning_time
  id: morning_open
  enabled: !input morning_enabled
- trigger: state
  entity_id: !input window_sensor
  to:
  - 'on'
  - open
  - tilted
  for:
    seconds: 2
  id: window_change
- trigger: state
  entity_id: !input window_sensor
  to:
  - 'on'
  - open
  for:
    minutes: !input notification_timeout
  id: window_open_long
- trigger: state
  entity_id: !input window_sensor
  to: tilted
  for:
    minutes: !input notification_timeout_tilted
  id: window_tilted_long
- trigger: state
  entity_id: !input window_sensor
  to:
  - 'off'
  - closed
  for:
    seconds: 2
  id: window_closed
- trigger: state
  entity_id: !input pause_boolean
  from: 'on'
  to: 'off'
  id: pause_ended
- trigger: state
  entity_id: !input pause_boolean
  from: 'off'
  to: 'on'
  id: pause_ended
- trigger: state
  entity_id: !input night_mode_boolean
  to: 'on'
  id: night_close
- trigger: numeric_state
  entity_id: !input weather_entity
  attribute: wind_speed
  above: !input wind_speed_threshold
  id: storm_detected
  enabled: !input storm_enabled
- trigger: numeric_state
  entity_id: !input storm_wind_sensor
  above: !input wind_speed_threshold
  id: storm_detected
  enabled: !input storm_enabled
- trigger: event
  event_type: mobile_app_notification_action
  event_data:
    action: CLOSE_SHUTTER__{{ window_sensor_tv }}
  id: close_shutter_action
- trigger: time_pattern
  minutes: /5
  id: shading_tick
  enabled: !input shading_enabled
- trigger: time_pattern
  minutes: /5
  id: solar_heating_tick
  enabled: !input solar_heating_enabled
- trigger: state
  entity_id: !input window_sensor
  to:
  - 'on'
  - open
  - tilted
  for:
    seconds: 2
  id: mosquito_lights
  enabled: !input mosquito_enabled
actions:
- condition: "{{ trigger.id | default('') in ['storm_detected', 'window_closed', 'close_shutter_action']\n
    \  or not pause_active }}"
- choose:
  - conditions:
    - condition: trigger
      id: morning_open
    sequence:
    - variables:
        wind_now: "{% if storm_wind_sensor is string %}\n  {{ states(storm_wind_sensor)
          | float(0) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'wind_speed') | float(0) }}\n{% else %}\n  0\n{% endif %}"
    - condition: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold
        }}'
    - choose:
      - conditions:
        - '{{ state_attr(cover_entity, ''current_position'') is not none }}'
        - '{{ state_attr(cover_entity, ''current_position'') | int(101) < morning_position
          }}'
        sequence:
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input morning_position
      - conditions:
        - '{{ state_attr(cover_entity, ''current_position'') is none }}'
        sequence:
        - action: cover.open_cover
          target:
            entity_id: !input cover
    - if:
      - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'')
        }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ shading_status_helper }}'
  - conditions:
    - condition: trigger
      id: night_close
    sequence:
    - if:
      - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'')
        }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ shading_status_helper }}'
    - if:
      - '{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper,
        ''on'') }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ solar_heating_status_helper }}'
    - choose:
      - conditions:
        - '{{ states(window_sensor) == ''tilted'' or (treat_open_as_tilted and states(window_sensor)
          in [''on'', ''open'']) }}'
        sequence:
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input tilted_position
      - conditions:
        - '{{ states(window_sensor) in [''on'', ''open''] }}'
        sequence:
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input night_ventilation_position
      default:
      - action: cover.close_cover
        target:
          entity_id: !input cover
  - conditions:
    - condition: trigger
      id: storm_detected
    - '{{ force_storm_action or states(window_sensor) in [''off'', ''closed''] }}'
    sequence:
    - if:
      - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'')
        }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ shading_status_helper }}'
    - if:
      - '{{ not panzer_mode }}'
      then:
      - action: cover.open_cover
        target:
          entity_id: !input cover
      else:
      - action: cover.close_cover
        target:
          entity_id: !input cover
  - conditions:
    - condition: trigger
      id: pause_ended
    - "{% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean
      %} {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %} {% set ns
      = namespace(all = helpers | length > 0) %} {% for h in helpers %}\n  {% set
      st = trigger.from_state.state if h == trigger.entity_id else states(h) %}\n
      \ {% if st != pausing %}{% set ns.all = false %}{% endif %}\n{% endfor %} {{
      ns.all }}"
    sequence:
    - if:
      - '{{ shading_status_helper is string and is_state(shading_status_helper, ''on'')
        }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ shading_status_helper }}'
    - variables:
        wind_now: "{% if storm_wind_sensor is string %}\n  {{ states(storm_wind_sensor)
          | float(0) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'wind_speed') | float(0) }}\n{% else %}\n  0\n{% endif %}"
    - if:
      - '{{ night_mode_boolean is string and is_state(night_mode_boolean, ''on'')
        }}'
      - '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}'
      then:
      - choose:
        - conditions:
          - '{{ states(window_sensor) == ''tilted'' or (treat_open_as_tilted and states(window_sensor)
            in [''on'', ''open'']) }}'
          sequence:
          - action: cover.set_cover_position
            target:
              entity_id: !input cover
            data:
              position: !input tilted_position
        - conditions:
          - '{{ states(window_sensor) in [''on'', ''open''] }}'
          sequence:
          - action: cover.set_cover_position
            target:
              entity_id: !input cover
            data:
              position: !input night_ventilation_position
        default:
        - action: cover.close_cover
          target:
            entity_id: !input cover
  - conditions:
    - condition: trigger
      id: shading_tick
    sequence:
    - if:
      - '{{ shading_status_helper is not string }}'
      then:
      - action: persistent_notification.create
        data:
          notification_id: rollladen_helfer_fehlt_{{ cover_entity | slugify }}
          title: 'Rollladensteuerung: Status-Helfer fehlt'
          message: Der Sonnenschutz für "{{ state_attr(cover_entity, 'friendly_name')
            or cover_entity }}" ist aktiviert, aber es ist kein Status-Helfer (input_boolean)
            ausgewählt — die Beschattung bleibt dadurch wirkungslos. Bitte in der
            Automation einen Helfer auswählen oder den Sonnenschutz deaktivieren.
      - stop: Sonnenschutz aktiviert, aber kein Status-Helfer konfiguriert
    - variables:
        sun_elevation: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
        sun_azimuth: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
        az_diff: '{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}'
        sun_in_window: "{{ sun_elevation >= shading_min_elevation\n   and az_diff
          >= (0 - shading_fov_left)\n   and az_diff <= shading_fov_right }}"
        outdoor_temp: "{% if shading_temp_sensor is string %}\n  {{ states(shading_temp_sensor)
          | float(-99) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'temperature') | float(-99) }}\n{% else %}\n  -99\n{% endif %}"
        wind_now: "{% if storm_wind_sensor is string %}\n  {{ states(storm_wind_sensor)
          | float(0) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'wind_speed') | float(0) }}\n{% else %}\n  0\n{% endif %}"
        storm_ok: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold
          }}'
        temp_available: "{% if shading_temp_sensor is string %}\n  {{ has_value(shading_temp_sensor)
          }}\n{% elif weather_entity is string %}\n  {{ has_value(weather_entity)
          and state_attr(weather_entity, 'temperature') is not none }}\n{% else %}\n
          \ false\n{% endif %}"
        weather_ok: "{{ shading_weather_states | length == 0\n   or not (weather_entity
          is string)\n   or states(weather_entity) in ['unknown', 'unavailable']\n
          \  or states(weather_entity) in shading_weather_states }}"
        weather_bad_stable: "{{ shading_weather_states | length > 0\n   and weather_entity
          is string\n   and states(weather_entity) not in ['unknown', 'unavailable']\n
          \  and states(weather_entity) not in shading_weather_states\n   and (as_timestamp(now())
          - as_timestamp(states[weather_entity].last_changed)) > 600 }}"
    - choose:
      - conditions:
        - '{{ sun_in_window and outdoor_temp >= shading_temp_threshold }}'
        - '{{ storm_ok }}'
        - '{{ weather_ok }}'
        - '{{ not (night_mode_boolean is string and is_state(night_mode_boolean, ''on''))
          }}'
        - '{{ force_shading or treat_open_as_tilted or states(window_sensor) not in
          [''on'', ''open''] }}'
        sequence:
        - variables:
            ray_height: "{{ shading_depth * tan(sun_elevation * pi / 180)\n   / ([cos(az_diff
              * pi / 180), 0.087] | max) }}"
            target_position: "{% set glass_free = [[(ray_height - window_sill_height)
              / window_height * 100, 0] | max, 100] | min %} {% set a = glass_bottom_position
              | int(0) %} {% set b = glass_top_position | int(100) %} {% if b <= a
              %}{% set a = 0 %}{% set b = 100 %}{% endif %} {% set p = (a + glass_free
              * (b - a) / 100) | round(0) | int %} {% set p = [p, shading_min_position
              | int] | max %} {% set p = [p, 100] | min %} {% if states(window_sensor)
              in ['tilted', 'on', 'open'] %}\n  {{ [p, tilted_position | int] | max
              }}\n{% else %}\n  {{ p }}\n{% endif %}"
            current_position: '{{ state_attr(cover_entity, ''current_position'') |
              int(-1) }}'
        - condition: '{{ current_position >= 0 }}'
        - variables:
            deviation: '{{ (current_position - target_position | int) | abs }}'
        - if:
          - '{{ is_state(shading_status_helper, ''on'') }}'
          then:
          - if:
            - '{{ deviation >= shading_min_change and deviation <= shading_override_threshold
              }}'
            then:
            - action: cover.set_cover_position
              target:
                entity_id: !input cover
              data:
                position: '{{ target_position }}'
          else:
          - action: input_boolean.turn_on
            target:
              entity_id: '{{ shading_status_helper }}'
          - if:
            - '{{ deviation >= shading_min_change }}'
            then:
            - action: cover.set_cover_position
              target:
                entity_id: !input cover
              data:
                position: '{{ target_position }}'
      - conditions:
        - '{{ is_state(shading_status_helper, ''on'') }}'
        - "{{ (not sun_in_window)\n   or (temp_available and outdoor_temp <= (shading_temp_threshold
          - shading_temp_hysteresis))\n   or weather_bad_stable }}"
        - '{{ not (night_mode_boolean is string and is_state(night_mode_boolean, ''on''))
          }}'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ shading_status_helper }}'
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input shading_end_position
  - conditions:
    - condition: trigger
      id: solar_heating_tick
    sequence:
    - if:
      - '{{ solar_heating_status_helper is not string }}'
      then:
      - action: persistent_notification.create
        data:
          notification_id: rollladen_heizhelfer_fehlt_{{ cover_entity | slugify }}
          title: 'Rollladensteuerung: Status-Helfer fehlt'
          message: Sonnenheizen für "{{ state_attr(cover_entity, 'friendly_name')
            or cover_entity }}" ist aktiviert, aber es ist kein eigener Status-Helfer
            (input_boolean) ausgewählt — das Feature bleibt dadurch wirkungslos. Bitte
            in der Automation einen Helfer auswählen oder Sonnenheizen deaktivieren.
      - stop: Sonnenheizen aktiviert, aber kein Status-Helfer konfiguriert
    - variables:
        sun_elevation: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
        sun_azimuth: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
        az_diff: '{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}'
        sun_in_window: "{{ sun_elevation >= shading_min_elevation\n   and az_diff
          >= (0 - shading_fov_left)\n   and az_diff <= shading_fov_right }}"
        outdoor_temp: "{% if shading_temp_sensor is string %}\n  {{ states(shading_temp_sensor)
          | float(99) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'temperature') | float(99) }}\n{% else %}\n  99\n{% endif %}"
        temp_available: "{% if shading_temp_sensor is string %}\n  {{ has_value(shading_temp_sensor)
          }}\n{% elif weather_entity is string %}\n  {{ has_value(weather_entity)
          and state_attr(weather_entity, 'temperature') is not none }}\n{% else %}\n
          \ false\n{% endif %}"
        night_mode_on: '{{ night_mode_boolean is string and is_state(night_mode_boolean,
          ''on'') }}'
        wind_now: "{% if storm_wind_sensor is string %}\n  {{ states(storm_wind_sensor)
          | float(0) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'wind_speed') | float(0) }}\n{% else %}\n  0\n{% endif %}"
        storm_ok: '{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold
          }}'
    - choose:
      - conditions:
        - '{{ not is_state(solar_heating_status_helper, ''on'') }}'
        - '{{ sun_in_window and outdoor_temp <= solar_heating_temp_threshold }}'
        - '{{ not night_mode_on }}'
        - '{{ storm_ok }}'
        - "{{ state_attr(cover_entity, 'current_position') is not none\n   and state_attr(cover_entity,
          'current_position') | int(101) < solar_heating_min_position }}"
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ solar_heating_status_helper }}'
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input solar_heating_position
      - conditions:
        - '{{ is_state(solar_heating_status_helper, ''on'') }}'
        - "{{ (not sun_in_window)\n   or (temp_available and outdoor_temp >= (solar_heating_temp_threshold
          + solar_heating_temp_hysteresis))\n   or night_mode_on }}"
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ solar_heating_status_helper }}'
  - conditions:
    - condition: trigger
      id: mosquito_lights
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: time
      after: !input mosquito_after_time
    sequence:
    - variables:
        mosquito_area: "{{ mosquito_area_input if mosquito_area_input is string and
          mosquito_area_input\n   else area_id(window_sensor) }}"
        lights_to_turn_off: "{% if mosquito_area %}\n  {{ expand(area_entities(mosquito_area))\n
          \    | selectattr('domain', 'eq', 'light')\n     | selectattr('state', 'eq',
          'on')\n     | map(attribute='entity_id')\n     | reject('in', mosquito_exclude)\n
          \    | list }}\n{% else %}\n  {{ [] }}\n{% endif %}"
    - condition: '{{ lights_to_turn_off | length > 0 }}'
    - action: light.turn_off
      target:
        entity_id: '{{ lights_to_turn_off }}'
  - conditions:
    - condition: trigger
      id:
      - window_open_long
      - window_tilted_long
    - '{{ not (sleep_mode_boolean is string and is_state(sleep_mode_boolean, ''on''))
      }}'
    - '{{ device_name_map | length > 0 }}'
    sequence:
    - variables:
        state_word: '{{ ''offen'' if trigger.id == ''window_open_long'' else ''gekippt''
          }}'
        timeout_used: '{{ notification_timeout if trigger.id == ''window_open_long''
          else notification_timeout_tilted }}'
        has_area: '{{ use_area_name and area_name(window_sensor) is not none }}'
        window_label: "{%- if has_area -%}\n  {{ area_name(window_sensor) }}\n{%-
          else -%}\n  {{ state_attr(window_sensor, 'friendly_name') or window_sensor
          }}\n{%- endif -%}"
        title_text: "{%- if has_area -%}\n  Fenster {{ state_word }} in {{ window_label
          }}\n{%- else -%}\n  Fenster {{ state_word }}\n{%- endif -%}"
        message_text: "{%- if has_area -%}\n  Das Fenster im Bereich '{{ window_label
          }}' ist seit über {{ timeout_used }} Minuten {{ state_word }}.\n{%- else
          -%}\n  Fenster '{{ window_label }}' ist seit über {{ timeout_used }} Minuten
          {{ state_word }}.\n{%- endif -%}"
    - repeat:
        for_each: '{{ device_name_map }}'
        sequence:
        - action: notify.{{ repeat.item }}
          continue_on_error: true
          data:
            title: '{{ title_text }}'
            message: '{{ message_text }}'
            data:
              tag: '{{ notification_tag }}'
              actions:
              - action: '{{ action_id }}'
                title: Rollladen schließen
  - conditions:
    - condition: trigger
      id: window_closed
    - '{{ device_name_map | length > 0 }}'
    sequence:
    - repeat:
        for_each: '{{ device_name_map }}'
        sequence:
        - action: notify.{{ repeat.item }}
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: '{{ notification_tag }}'
  - conditions:
    - condition: trigger
      id: close_shutter_action
    - '{{ trigger.event.data.action == action_id }}'
    sequence:
    - action: cover.close_cover
      target:
        entity_id: !input cover
  - conditions:
    - condition: trigger
      id: window_change
    sequence:
    - variables:
        night_mode_on: '{{ night_mode_boolean is string and is_state(night_mode_boolean,
          ''on'') }}'
        reclose_scene: scene.reclose_{{ cover_entity | slugify }}
    - if:
      - "{{ trigger.from_state is not none\n   and (trigger.from_state.state in ['off',
        'closed']\n        or (trigger.from_state.state in ['unavailable', 'unknown']\n
        \           and expand(reclose_scene) | count == 0)) }}"
      then:
      - action: scene.create
        data:
          scene_id: '{{ ''reclose_'' ~ (cover_entity | slugify) }}'
          snapshot_entities:
          - '{{ cover_entity }}'
    - choose:
      - conditions:
        - '{{ trigger.to_state.state == ''tilted'' or (treat_open_as_tilted and trigger.to_state.state
          in [''on'', ''open'']) }}'
        - '{{ state_attr(cover_entity, ''current_position'') | int(101) < tilted_position
          }}'
        sequence:
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input tilted_position
      - conditions:
        - '{{ trigger.to_state.state in [''on'', ''open''] }}'
        - '{{ not treat_open_as_tilted }}'
        - '{{ not night_mode_on }}'
        - '{{ not (force_shading and shading_status_helper is string and is_state(shading_status_helper,
          ''on'')) }}'
        sequence:
        - action: cover.open_cover
          target:
            entity_id: !input cover
        - if:
          - '{{ shading_status_helper is string and is_state(shading_status_helper,
            ''on'') }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: '{{ shading_status_helper }}'
      - conditions:
        - '{{ trigger.to_state.state in [''on'', ''open''] }}'
        - '{{ not treat_open_as_tilted }}'
        - '{{ night_mode_on }}'
        - '{{ state_attr(cover_entity, ''current_position'') | int(101) < night_ventilation_position
          }}'
        sequence:
        - action: cover.set_cover_position
          target:
            entity_id: !input cover
          data:
            position: !input night_ventilation_position
    - wait_for_trigger:
      - trigger: state
        entity_id: !input window_sensor
        to:
        - 'off'
        - closed
        for:
          seconds: 2
      timeout:
        minutes: !input reclose_timeout
      continue_on_timeout: true
    - variables:
        night_mode_on_now: '{{ night_mode_boolean is string and is_state(night_mode_boolean,
          ''on'') }}'
        pause_now: "{% set helpers = [pause_boolean] if pause_boolean is string else
          pause_boolean %} {% set pausing = 'on' if pause_mode == 'on_pauses' else
          'off' %} {% set found = expand(helpers) | list %} {{ helpers | length >
          0\n   and found | length > 0\n   and found | rejectattr('state', 'eq', pausing)
          | list | length == 0 }}"
        wind_now: "{% if storm_wind_sensor is string %}\n  {{ states(storm_wind_sensor)
          | float(0) }}\n{% elif weather_entity is string %}\n  {{ state_attr(weather_entity,
          'wind_speed') | float(0) }}\n{% else %}\n  0\n{% endif %}"
        storm_now: '{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold
          }}'
    - if:
      - '{{ wait.trigger is none }}'
      then:
      - if:
        - '{{ force_close }}'
        - '{{ not pause_now }}'
        then:
        - action: cover.close_cover
          target:
            entity_id: !input cover
      else:
      - choose:
        - conditions:
          - '{{ night_mode_on_now }}'
          - '{{ not pause_now }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover
        - conditions:
          - '{{ not storm_now }}'
          - '{{ not pause_now }}'
          - '{{ expand(reclose_scene) | count > 0 }}'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: '{{ reclose_scene }}'
          - if:
            - '{{ shading_status_helper is string and is_state(shading_status_helper,
              ''on'') }}'
            then:
            - action: input_boolean.turn_off
              target:
                entity_id: '{{ shading_status_helper }}'
