# =============================================================================
# ClimateWindow.yaml
#
# VERSION: 1.1.1
# =============================================================================

blueprint:
  name: ClimateWindow V1.1.1
  description: >
    Steuert einen motorisierten Fensteröffner anhand der absoluten
    Luftfeuchtigkeit innen und außen. Das Fenster wird nur geöffnet, wenn
    der Raum zu feucht ist, die Außenluft ausreichend trockener ist und die
    Außentemperatur im erlaubten Bereich liegt. Separate Schwellwerte für
    Öffnen und Schließen verhindern häufige Richtungswechsel. Regen,
    optionale Sperr-Entitäten und ungültige Sensordaten schließen das
    Fenster mit hoher Priorität.
  domain: automation
  author: Jonny.S@gmx.de
  source_url: https://github.com/elbrondor/MyBlueprints/blob/master/ClimateWindow.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    assignment:
      name: Fenster und Sensoren
      icon: mdi:window-open-variant
      input:
        window_cover:
          name: Fensteröffner
          description: Das zu steuernde motorisierte Fenster.
          selector:
            entity:
              filter:
                - domain: cover
        indoor_absolute_humidity:
          name: Absolute Luftfeuchtigkeit innen
          description: Sensor mit der Einheit g/m3 für den zu lüftenden Raum.
          selector:
            entity:
              filter:
                - domain: sensor
        outdoor_absolute_humidity:
          name: Absolute Luftfeuchtigkeit außen
          description: Sensor mit der Einheit g/m3 für die Außenluft.
          selector:
            entity:
              filter:
                - domain: sensor
        indoor_relative_humidity:
          name: Relative Luftfeuchtigkeit innen
          description: Feuchtesensor des zu lüftenden Raums.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        outdoor_temperature:
          name: Außentemperatur
          description: Temperatursensor für die Außenluft.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    safety:
      name: Schutz und Sperren
      icon: mdi:shield-lock-outline
      input:
        rain_protection_enabled:
          name: Regenschutz aktivieren
          description: Schließt das Fenster, sobald ein Regensensor aktiv ist.
          default: true
          selector:
            boolean: {}
        rain_sensors:
          name: Regensensoren
          description: Optionale binäre Sensoren, die bei Regen den Zustand on melden.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: true
        blocking_enabled:
          name: Sperr-Entität berücksichtigen
          description: Aktiviert die Auswertung der ausgewählten Sperr-Entitäten.
          default: false
          selector:
            boolean: {}
        blocking_entities:
          name: Sperr-Entität
          description: >
            Eine oder mehrere Entitäten, die bei Zustand on das Fenster
            schließen. Hier können zum Beispiel ein Trockner und eine
            Abwesenheits-Entität ausgewählt werden.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch
              multiple: true

    thresholds:
      name: Lüftungsgrenzen
      icon: mdi:tune-variant
      input:
        humidity_open_threshold:
          name: Raumfeuchte zum Öffnen
          description: Ab dieser relativen Raumfeuchte darf geöffnet werden.
          default: 60
          selector:
            number:
              min: 30
              max: 90
              step: 1
              unit_of_measurement: "%"
              mode: slider
        humidity_close_threshold:
          name: Raumfeuchte zum Schließen
          description: >
            Unterhalb dieses Werts wird geschlossen. Der Wert sollte kleiner
            als die Grenze zum Öffnen sein.
          default: 55
          selector:
            number:
              min: 20
              max: 85
              step: 1
              unit_of_measurement: "%"
              mode: slider
        absolute_open_margin:
          name: Mindestvorteil zum Öffnen
          description: >
            Die Innenluft muss mindestens um diesen Wert feuchter als die
            Außenluft sein.
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 5.0
              step: 0.1
              unit_of_measurement: g/m3
              mode: box
        absolute_close_margin:
          name: Restvorteil zum Schließen
          description: >
            Wird der Feuchteunterschied kleiner oder gleich diesem Wert, wird
            geschlossen. Der Wert sollte kleiner als der Mindestvorteil zum
            Öffnen sein.
          default: 0.1
          selector:
            number:
              min: 0.0
              max: 4.9
              step: 0.1
              unit_of_measurement: g/m3
              mode: box
        minimum_outdoor_temperature:
          name: Minimale Außentemperatur
          description: Unterhalb dieser Temperatur bleibt das Fenster geschlossen.
          default: 5
          selector:
            number:
              min: -20
              max: 25
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        maximum_outdoor_temperature:
          name: Maximale Außentemperatur
          description: Oberhalb dieser Temperatur bleibt das Fenster geschlossen.
          default: 35
          selector:
            number:
              min: 5
              max: 45
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    winter_ventilation:
      name: Winter-Lüftungsfenster
      icon: mdi:snowflake-clock
      input:
        winter_ventilation_enabled:
          name: Winter-Lüftungsfenster aktivieren
          description: >
            Erlaubt im Winter während des konfigurierten Zeitfensters eine
            niedrigere Außentemperatur.
          default: false
          selector:
            boolean: {}
        season_sensor:
          name: Saison-Sensor
          description: Sensor, der im Winter den Zustand winter meldet.
          default: sensor.season
          selector:
            entity:
              filter:
                - domain: sensor
        winter_ventilation_start:
          name: Beginn des Winter-Lüftungsfensters
          default: "12:00:00"
          selector:
            time: {}
        winter_ventilation_end:
          name: Ende des Winter-Lüftungsfensters
          default: "13:00:00"
          selector:
            time: {}
        winter_minimum_outdoor_temperature:
          name: Minimale Außentemperatur im Winter-Lüftungsfenster
          description: >
            Unterhalb dieser Temperatur bleibt das Fenster auch innerhalb
            des Winter-Lüftungsfensters geschlossen.
          default: 0
          selector:
            number:
              min: -20
              max: 25
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

mode: restart
max_exceeded: silent

variables:
  window_entity: !input window_cover
  indoor_absolute_entity: !input indoor_absolute_humidity
  outdoor_absolute_entity: !input outdoor_absolute_humidity
  indoor_relative_entity: !input indoor_relative_humidity
  outdoor_temperature_entity: !input outdoor_temperature
  configured_rain_sensors: !input rain_sensors
  configured_blocking_entities: !input blocking_entities
  use_rain_protection: !input rain_protection_enabled
  use_blocking_entities: !input blocking_enabled
  open_humidity: !input humidity_open_threshold
  close_humidity: !input humidity_close_threshold
  open_margin: !input absolute_open_margin
  close_margin: !input absolute_close_margin
  minimum_temperature: !input minimum_outdoor_temperature
  maximum_temperature: !input maximum_outdoor_temperature
  use_winter_ventilation: !input winter_ventilation_enabled
  season_entity: !input season_sensor
  winter_start: !input winter_ventilation_start
  winter_end: !input winter_ventilation_end
  winter_minimum_temperature: !input winter_minimum_outdoor_temperature
  indoor_absolute_value: "{{ states(indoor_absolute_entity) | float(none) }}"
  outdoor_absolute_value: "{{ states(outdoor_absolute_entity) | float(none) }}"
  indoor_relative_value: "{{ states(indoor_relative_entity) | float(none) }}"
  outdoor_temperature_value: "{{ states(outdoor_temperature_entity) | float(none) }}"
  sensor_values_valid: >
    {{
      is_number(indoor_absolute_value)
      and is_number(outdoor_absolute_value)
      and is_number(indoor_relative_value)
      and is_number(outdoor_temperature_value)
    }}
  rain_active: >
    {{
      use_rain_protection | bool
      and configured_rain_sensors | length > 0
      and expand(configured_rain_sensors)
        | selectattr('state', 'eq', 'on')
        | list
        | count > 0
    }}
  blocking_active: >
    {{
      use_blocking_entities | bool
      and configured_blocking_entities | length > 0
      and expand(configured_blocking_entities)
        | selectattr('state', 'eq', 'on')
        | list
        | count > 0
    }}
  temperature_allowed: >
    {% set current_time = now().strftime('%H:%M:%S') %}
    {% set start_time = winter_start | string %}
    {% set end_time = winter_end | string %}
    {% set within_winter_time =
      (start_time <= end_time and start_time <= current_time < end_time)
      or
      (start_time > end_time and (current_time >= start_time or current_time < end_time))
    %}
    {{
      is_number(outdoor_temperature_value)
      and (outdoor_temperature_value | float) <= (maximum_temperature | float)
      and
      (
        (outdoor_temperature_value | float) >= (minimum_temperature | float)
        or
        (
          use_winter_ventilation | bool
          and states(season_entity) == 'winter'
          and within_winter_time
          and (outdoor_temperature_value | float)
            >= (winter_minimum_temperature | float)
        )
      )
    }}

triggers:
  - id: periodic_check
    trigger: time_pattern
    minutes: "/5"
  - id: indoor_absolute_changed
    trigger: state
    entity_id: !input indoor_absolute_humidity
  - id: outdoor_absolute_changed
    trigger: state
    entity_id: !input outdoor_absolute_humidity
  - id: indoor_relative_changed
    trigger: state
    entity_id: !input indoor_relative_humidity
  - id: outdoor_temperature_changed
    trigger: state
    entity_id: !input outdoor_temperature
  - id: season_changed
    trigger: state
    entity_id: !input season_sensor
  - id: winter_ventilation_started
    trigger: time
    at: !input winter_ventilation_start
  - id: winter_ventilation_ended
    trigger: time
    at: !input winter_ventilation_end
  - id: rain_changed
    trigger: state
    entity_id: !input rain_sensors
  - id: blocking_changed
    trigger: state
    entity_id: !input blocking_entities
  - id: home_assistant_started
    trigger: homeassistant
    event: start

actions:
  - choose:
      - alias: Bei ungültigen Sensordaten sicher schließen
        conditions:
          - "{{ not (sensor_values_valid | bool) }}"
        sequence:
          - if:
              - condition: state
                entity_id: !input window_cover
                state:
                  - open
                  - opening
            then:
              - action: cover.close_cover
                target:
                  entity_id: !input window_cover
          - stop: Kritische Sensordaten sind ungültig. Fenster bleibt geschlossen.

  - choose:
      - alias: Bei Regen oder aktiver Sperre schließen
        conditions:
          - "{{ rain_active | bool or blocking_active | bool }}"
        sequence:
          - if:
              - condition: state
                entity_id: !input window_cover
                state:
                  - open
                  - opening
            then:
              - action: cover.close_cover
                target:
                  entity_id: !input window_cover
          - stop: Regenschutz oder Sperr-Entität ist aktiv.

  - choose:
      - alias: Bei geeignetem Lüftungsfenster öffnen
        conditions:
          - >
            {{
              sensor_values_valid | bool
              and (indoor_relative_value | float) >= (open_humidity | float)
              and
              (
                (indoor_absolute_value | float)
                - (outdoor_absolute_value | float)
              ) >= (open_margin | float)
              and
              temperature_allowed | bool
            }}
        sequence:
          - if:
              - condition: state
                entity_id: !input window_cover
                state:
                  - closed
                  - closing
            then:
              - action: cover.open_cover
                target:
                  entity_id: !input window_cover
          - stop: Die Bedingungen zum Lüften sind erfüllt.

  - choose:
      - alias: Bei erreichter Ziel- oder Schutzgrenze schließen
        conditions:
          - >
            {{
              sensor_values_valid | bool
              and
              (
                (indoor_relative_value | float) <= (close_humidity | float)
                or
                (
                  (indoor_absolute_value | float)
                  - (outdoor_absolute_value | float)
                ) <= (close_margin | float)
                or
                not (temperature_allowed | bool)
              )
            }}
        sequence:
          - if:
              - condition: state
                entity_id: !input window_cover
                state:
                  - open
                  - opening
            then:
              - action: cover.close_cover
                target:
                  entity_id: !input window_cover
          - stop: Die Ziel- oder Schutzgrenze zum Schließen ist erreicht.
