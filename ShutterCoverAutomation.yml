# =============================================================================
# ShutterCoverAutomation.yml
#
# VERSION: 0.1.0
#
# Features
# --------
#
# - Sunrise / Sunset
# - Workday Sensor
# - Feiertage über Workday Sensor
# - Früheste Öffnungszeiten
# - Türschutz
# - Verzögerung nach Türschließung
# - Manuelle Übersteuerung über Shelly Inputs
# - Kühlung
# - Azimutbasierte Beschattung
# - Globalbeschattung ab 28°C
# - Logbook Integration
# - Beschattung aufheben 1h vor Sonnenuntergang
#
# PRIORITÄTEN
#
# 1. Manual Override
# 2. Aussperrschutz
# 3. Globalbeschattung >= 28°C
# 4. Normale Beschattung
# 5. Sunrise / Sunset
#
# =============================================================================

blueprint:

  name: Shutter Cover Automation Enterprise

  description: >

    Enterprise Blueprint für Rollos:

    - Sunrise/Sunset
    - Workday Sensor
    - Holiday Support
    - Manual Override
    - Cooling
    - Global Shading
    - Azimuth Profiles
    - Logbook Integration

  domain: automation
  author: Jonny.S@gmx.de
  homeassistant:
    min_version: 2026.8.0
  source_url: https://github.com/elbrondor/MyBlueprints/blob/master/ShutterCoverAutomation.yml

# =============================================================================
# INPUTS
# =============================================================================

  input:
    assignment_section:
      name: Grundeinstellungen
      description: Grundlegende Einstellungen für das zu Steuernde Rollo
      icon: mdi:vector-link
      input:
        my_cover:
          name: Rollo
          description: Das zu Steuernde Rollo
          selector:
            entity:
              domain:
              - cover
              multiple: false
              reorder: false



# =============================================================================
# MODE
# =============================================================================

mode: restart


# =============================================================================
# VARIABLES
# =============================================================================

variables:

  cover_entity: !input cover_entity

  workday_sensor: !input workday_sensor

  weather_entity: !input weather_entity

  outdoor_temperature_sensor: !input outdoor_temperature_sensor

  door_sensor: !input door_sensor

  manual_override_entity_1: !input manual_override_entity_1

  manual_override_entity_2: !input manual_override_entity_2

  manual_override_active: >

    {% set t1 =
       as_timestamp(states[manual_override_entity_1].last_changed)
       if manual_override_entity_1 != ''
       else 0 %}

    {% set t2 =
       as_timestamp(states[manual_override_entity_2].last_changed)
       if manual_override_entity_2 != ''
       else 0 %}

    {% set latest = [t1,t2]|max %}

    {{ (as_timestamp(now()) - latest) < 900 }}

  is_workday: >

    {{ is_state(workday_sensor,'on') }}

  sun_azimuth: >

    {{ state_attr('sun.sun','azimuth') | float(0) }}

  sun_elevation: >

    {{ state_attr('sun.sun','elevation') | float(0) }}

  global_shading_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      28
    }}

  cooling_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      24
    }}

  weather_ok: >

    {{
      states(weather_entity)
      in
      [
        'sunny',
        'clear',
        'partlycloudy'
      ]
    }}

# =============================================================================
# TRIGGERS
# =============================================================================

trigger:

  - platform: sun
    event: sunrise
    offset: !input sunrise_offset
    id: sunrise

  - platform: sun
    event: sunset
    offset: !input sunset_offset
    id: sunset

  - platform: sun
    event: sunset
    offset: "-01:00:00"
    id: cooling_release

  - platform: time
    at: !input earliest_weekday
    id: weekday_open

  - platform: time
    at: !input earliest_weekend
    id: weekend_open

  - platform: state
    entity_id: !input door_sensor
    id: door_changed

  - platform: state
    entity_id: !input outdoor_temperature_sensor
    id: temperature_changed

  - platform: state
    entity_id: !input weather_entity
    id: weather_changed

  - platform: state
    entity_id: !input manual_override_entity_1
    id: manual_override

  - platform: state
    entity_id: !input manual_override_entity_2
    id: manual_override

  - platform: time_pattern
    minutes: "/5"
    id: evaluation


# =============================================================================
# ACTIONS
# =============================================================================

action:

  - choose:

# -----------------------------------------------------------------------------
# MANUAL OVERRIDE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ manual_override_active }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Manual override active.
                Automatic actions suspended.

# -----------------------------------------------------------------------------
# GLOBAL SHADING
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ not manual_override_active }}

          - condition: template
            value_template: >
              {{ global_shading_required }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Global shading active.

          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input cooling_position

# -----------------------------------------------------------------------------
# NORMAL COOLING
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ not manual_override_active }}

          - condition: template
            value_template: >
              {{ cooling_required }}

          - condition: template
            value_template: >
              {{ weather_ok }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Cooling active.

          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input cooling_position

# -----------------------------------------------------------------------------
# COOLING RELEASE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: cooling_release

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Cooling released one hour before sunset.

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# SUNRISE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: sunrise

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# WEEKDAY OPEN
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: weekday_open

          - condition: state
            entity_id: !input workday_sensor
            state: "on"

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# WEEKEND OPEN
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: weekend_open

          - condition: state
            entity_id: !input workday_sensor
            state: "off"

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# SUNSET
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: sunset

          - condition: template
            value_template: >

              {% if door_sensor != '' %}
                 {{ not is_state(door_sensor,'on') }}
              {% else %}
                 true
              {% endif %}

        sequence:

          - service: cover.close_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# DOOR CLOSED
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: door_changed

          - condition: template
            value_template: >
              {{ not is_state(door_sensor,'on') }}

        sequence:

          - delay: !input door_close_delay

          - service: cover.close_cover
            target:
              entity_id: !input cover_entity

default: []
