# =============================================================================
# ShutterCoverAutomation.yml
#
# VERSION: 0.3.4
#
# Home Assistant Blueprint zur automatischen Steuerung von Rollläden.
#
# Cover Position:
#     0 = vollständig geschlossen
#   100 = vollständig geöffnet
#
# PRIORITÄTEN
#
# 1. Aussperr-/Fensterschutz
# 2. Manuelle Übersteuerung
# 3. Referenz-Rollo / zusätzlicher Schließwunsch
# 4. Globalbeschattung
# 5. Normaler Tages-/Nachtbetrieb
#
# Fahrbefehle:
# - maximal 10 Versuche
# - 3 Sekunden zwischen den Versuchen
# - tatsächliche current_position wird geprüft
#
# =============================================================================


blueprint:

  name: Shutter Cover Automation Enterprise

  description: >
    Automatische Rollladensteuerung mit Sonnenaufgang/Sonnenuntergang,
    Workday-Unterstützung, Aussperr-/Lüftungsschutz, manueller
    Übersteuerung, Globalbeschattung, Referenz-Rollo und automatischer
    Wiederholung fehlgeschlagener Fahrbefehle.

  domain: automation

  author: Jonny.S@gmx.de

  homeassistant:
    min_version: 2026.8.0

  source_url: https://raw.githubusercontent.com/elbrondor/MyBlueprints/refs/heads/master/ShutterCoverAutomation.yml


  # ===========================================================================
  # INPUTS
  # ===========================================================================

  input:


    # =========================================================================
    # GRUNDEINSTELLUNGEN
    # =========================================================================

    assignment_section:

      name: Grundeinstellungen

      icon: mdi:window-shutter

      input:


        my_cover:

          name: Rollo

          description: >
            Der zu steuernde Rollladen.

            0 %   = vollständig geschlossen
            100 % = vollständig geöffnet

          selector:
            entity:
              domain:
                - cover
              multiple: false


        my_window_open_sensor:

          name: Fenster-/Türsensor (2 Zustände)

          description: >
            Optionaler einfacher Fenster-/Türkontakt.

            on  = geöffnet
            off = geschlossen

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                  device_class:
                    - door
                    - window
              multiple: true


        my_window_handle_sensor:

          name: Fenster-/Türgriff (3 Zustände)

          description: >
            Optionaler Sensor mit den Zuständen:

            open
            tilted
            closed

            open:
            vollständiger Aussperrschutz.

            tilted:
            Lüftungsschutz.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
              multiple: true


        my_cover_local_input_1:

          name: Lokaler Rollladenschalter 1

          description: >
            Optionaler Sensor zur Erkennung einer manuellen Bedienung.

            Nach einer Zustandsänderung wird die normale Automatik
            für 15 Minuten unterdrückt.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                - domain:
                    - sensor
              multiple: true


        my_cover_local_input_2:

          name: Lokaler Rollladenschalter 2

          description: >
            Optionaler zweiter Eingang für getrennte Auf-/Ab-Taster.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                - domain:
                    - sensor
              multiple: true


        my_protection_close_percentage:

          name: Maximale Schließung bei Lüftungsschutz

          description: >
            Gibt an, wie weit der Rollladen bei gekipptem Fenster
            oder geöffnetem Zwei-Zustands-Sensor maximal geschlossen
            sein darf.

            Beispiel:

            60 % geschlossen entspricht Cover-Position 40 %.

          default: 60

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider


        my_protection_delay:

          name: Verzögerung Fenster-/Türschutz

          description: >
            Wie lange muss der neue Fenster-/Türzustand stabil
            anliegen, bevor darauf reagiert wird?

          default: 10

          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "s"
              mode: slider



    # =========================================================================
    # WOCHENTAGE / WOCHENENDE / FEIERTAGE
    # =========================================================================

    week_modifier_section:

      name: Wochenende und Feiertage

      icon: mdi:calendar-week

      input:


        my_is_workday:

          name: Workday Sensor

          description: >
            on  = Arbeitstag
            off = Wochenende oder Feiertag

          default: binary_sensor.workday_sensor

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
              multiple: false


        my_early_open_wd:

          name: Frühestes Öffnen an Arbeitstagen

          default: "07:00:00"

          selector:
            time:


        my_early_open_we:

          name: Frühestes Öffnen am Wochenende / Feiertag

          default: "08:00:00"

          selector:
            time:



    # =========================================================================
    # SONNENUNTERGANG
    # =========================================================================

    sunset_section:

      name: Sonnenuntergang

      icon: mdi:weather-sunset-down

      input:


        my_down_offset:

          name: Offset zum Sonnenuntergang

          description: >
            Beispiele:

            -01:00:00 = eine Stunde vorher
            -00:30:00 = 30 Minuten vorher
             00:00:00 = genau bei Sonnenuntergang
             00:30:00 = 30 Minuten danach
             01:00:00 = eine Stunde danach

          default: "00:00:00"

          selector:
            text:



    # =========================================================================
    # ZUSÄTZLICHER SCHLIESS-TRIGGER
    # =========================================================================

    additional_close_section:

      name: Zusätzlicher Schließ-Trigger

      description: >
        Optional kann ein anderes Rollo als zusätzlicher Schließgeber
        verwendet werden.

        Ist dieses Referenz-Rollo nach dem tatsächlichen Sonnenuntergang
        geschlossen, wird auch dieses Rollo geschlossen.

        Der Aussperr-/Fensterschutz bleibt dabei aktiv.

      icon: mdi:window-shutter-alert

      collapsed: true

      input:


        my_close_reference_cover_enabled:

          name: Referenz-Rollo verwenden

          default: false

          selector:
            boolean:


        my_close_reference_cover:

          name: Referenz-Rollo

          description: >
            Optionales Rollo, dessen Schließen nach Sonnenuntergang
            ebenfalls das Schließen dieses Rollos auslöst.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - cover
              multiple: true



    # =========================================================================
    # GLOBALBESCHATTUNG
    # =========================================================================

    global_shading_section:

      name: Globalbeschattung

      description: >
        Temperatur-, Raumtemperatur- und bewölkungsabhängige
        Globalbeschattung.

      icon: mdi:weather-sunny-alert

      collapsed: true

      input:


        my_global_shading_enabled:

          name: Globalbeschattung aktivieren

          default: true

          selector:
            boolean:


        my_outdoor_temperature:

          name: Außentemperatur

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: true


        my_global_shading_temperature:

          name: Temperaturgrenze außen

          description: >
            Ab dieser Außentemperatur darf die Globalbeschattung
            aktiviert werden.

          default: 28

          selector:
            number:
              min: 15
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider


        my_weather:

          name: Wetter

          description: >
            Wetter-Entität zur Ermittlung des Attributes cloud_coverage.

          default: weather.forecast_home

          selector:
            entity:
              filter:
                - domain:
                    - weather
              multiple: false


        my_global_shading_cloud_coverage:

          name: Maximale Bewölkung

          description: >
            Bis zu diesem Bewölkungsgrad darf die Globalbeschattung
            aktiviert werden.

            0 %   = wolkenlos
            100 % = vollständig bewölkt

          default: 40

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider


        my_room_temperature:

          name: Raumtemperatur

          description: >
            Optionaler Temperatursensor für den Raum.

            Wird kein Sensor ausgewählt, wird die Raumtemperatur
            nicht berücksichtigt.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: true


        my_global_shading_room_temperature:

          name: Mindest-Raumtemperatur

          description: >
            Erst ab dieser Raumtemperatur darf die Globalbeschattung
            aktiviert werden.

          default: 23

          selector:
            number:
              min: 15
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider


        my_global_shading_position:

          name: Rollladenposition bei Globalbeschattung

          description: >
            0 %   = vollständig geschlossen
            100 % = vollständig geöffnet

          default: 30

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider



# =============================================================================
# TRIGGER
# =============================================================================

triggers:


  - trigger: sun
    event: sunrise
    id: sunrise


  - trigger: time
    at: !input my_early_open_wd
    id: early_open_wd


  - trigger: time
    at: !input my_early_open_we
    id: early_open_we


  - trigger: sun
    event: sunset
    offset: !input my_down_offset
    id: sunset


  # ---------------------------------------------------------------------------
  # REFERENZ-ROLLO
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_close_reference_cover
    to: "closed"
    id: reference_cover_closed


  # ---------------------------------------------------------------------------
  # DREI-ZUSTANDS-SENSOR
  #
  # from wird absichtlich NICHT eingeschränkt.
  #
  # Dadurch können wir in den Actions über trigger.from_state erkennen,
  # ob beispielsweise der Übergang
  #
  #     open -> tilted
  #
  # stattgefunden hat.
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "open"
    for:
      seconds: !input my_protection_delay
    id: handle_open


  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "tilted"
    for:
      seconds: !input my_protection_delay
    id: handle_tilted


  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "closed"
    for:
      seconds: !input my_protection_delay
    id: handle_closed


  # ---------------------------------------------------------------------------
  # ZWEI-ZUSTANDS-SENSOR
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_window_open_sensor
    to: "on"
    for:
      seconds: !input my_protection_delay
    id: window_open


  - trigger: state
    entity_id: !input my_window_open_sensor
    to: "off"
    for:
      seconds: !input my_protection_delay
    id: window_closed


  # ---------------------------------------------------------------------------
  # GLOBALBESCHATTUNG
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_outdoor_temperature
    id: global_shading_temperature_change


  - trigger: state
    entity_id: !input my_room_temperature
    id: global_shading_room_temperature_change


  - trigger: state
    entity_id: !input my_weather
    attribute: cloud_coverage
    id: global_shading_cloud_change



# =============================================================================
# VARIABLEN
# =============================================================================

variables:


  # ===========================================================================
  # ENTITÄTEN
  # ===========================================================================

  cover_entity: !input my_cover

  window_open_sensor: !input my_window_open_sensor
  window_handle_sensor: !input my_window_handle_sensor

  local_input_1: !input my_cover_local_input_1
  local_input_2: !input my_cover_local_input_2

  workday_sensor: !input my_is_workday

  close_reference_cover: !input my_close_reference_cover

  outdoor_temperature_entities: !input my_outdoor_temperature
  room_temperature_entities: !input my_room_temperature

  weather_entity: !input my_weather


  # ===========================================================================
  # KONFIGURATION
  # ===========================================================================

  early_open_wd: !input my_early_open_wd
  early_open_we: !input my_early_open_we

  sunset_offset: !input my_down_offset

  protection_close_percentage: !input my_protection_close_percentage

  close_reference_cover_enabled: !input my_close_reference_cover_enabled

  global_shading_enabled: !input my_global_shading_enabled
  global_shading_temperature: !input my_global_shading_temperature
  global_shading_cloud_coverage: !input my_global_shading_cloud_coverage
  global_shading_room_temperature: !input my_global_shading_room_temperature
  global_shading_position: !input my_global_shading_position


  # ===========================================================================
  # SCHUTZPOSITION / LÜFTUNGSPOSITION
  #
  # Beispiel:
  #
  # 60 % geschlossen
  # -> Cover-Position 40
  # ===========================================================================

  protection_position: >
    {{ 100 - (protection_close_percentage | int(60)) }}


  # ===========================================================================
  # MANUELLE ÜBERSTEUERUNG
  # ===========================================================================

  manual_override: >
    {% set ns = namespace(active=false) %}

    {% for entity in local_input_1 %}

      {% if states[entity] is defined %}

        {% if
          (now() - states[entity].last_changed).total_seconds()
          <
          900
        %}
          {% set ns.active = true %}
        {% endif %}

      {% endif %}

    {% endfor %}


    {% for entity in local_input_2 %}

      {% if states[entity] is defined %}

        {% if
          (now() - states[entity].last_changed).total_seconds()
          <
          900
        %}
          {% set ns.active = true %}
        {% endif %}

      {% endif %}

    {% endfor %}


    {{ ns.active }}


  # ===========================================================================
  # SUNSET-OFFSET IN SEKUNDEN
  # ===========================================================================

  sunset_offset_seconds: >
    {% set value = sunset_offset | string %}

    {% if value.startswith('-') %}
      {% set sign = -1 %}
      {% set value = value[1:] %}
    {% elif value.startswith('+') %}
      {% set sign = 1 %}
      {% set value = value[1:] %}
    {% else %}
      {% set sign = 1 %}
    {% endif %}

    {% set parts = value.split(':') %}

    {{
      sign *
      (
        (parts[0] | int(0)) * 3600
        +
        (parts[1] | int(0)) * 60
        +
        (parts[2] | int(0))
      )
    }}


  # ===========================================================================
  # TAGESBETRIEB
  # ===========================================================================

  daytime_active: >
    {% set offset = sunset_offset_seconds | int(0) %}

    {% if is_state(workday_sensor, 'on') %}
      {% set earliest_open = today_at(early_open_wd) %}
    {% else %}
      {% set earliest_open = today_at(early_open_we) %}
    {% endif %}


    {% if now() < earliest_open %}

      false

    {% elif is_state('sun.sun', 'above_horizon') %}

      {% if offset < 0 %}

        {% set next_setting =
             as_datetime(state_attr('sun.sun', 'next_setting'))
             | as_local %}

        {{
          now()
          <
          (
            next_setting
            +
            timedelta(seconds=offset)
          )
        }}

      {% else %}

        true

      {% endif %}

    {% else %}

      {% if offset > 0 %}

        {{
          now()
          <
          (
            states['sun.sun'].last_changed
            +
            timedelta(seconds=offset)
          )
        }}

      {% else %}

        false

      {% endif %}

    {% endif %}


  # ===========================================================================
  # REFERENZ-ROLLO FORDERT SCHLIESSEN
  # ===========================================================================

  reference_cover_requests_close: >
    {{
      close_reference_cover_enabled | bool
      and
      close_reference_cover | length > 0
      and
      is_state('sun.sun', 'below_horizon')
      and
      (
        expand(close_reference_cover)
        | selectattr('state', 'eq', 'closed')
        | list
        | count > 0
      )
    }}


  # ===========================================================================
  # AUSSENTEMPERATUR
  # ===========================================================================

  outdoor_temperature: >
    {% if outdoor_temperature_entities | length > 0 %}

      {{
        states(outdoor_temperature_entities[0])
        | float(-999)
      }}

    {% else %}

      -999

    {% endif %}


  # ===========================================================================
  # RAUMTEMPERATUR
  # ===========================================================================

  room_temperature: >
    {% if room_temperature_entities | length > 0 %}

      {{
        states(room_temperature_entities[0])
        | float(-999)
      }}

    {% else %}

      -999

    {% endif %}


  # ===========================================================================
  # RAUMTEMPERATUR ERLAUBT BESCHATTUNG?
  # ===========================================================================

  room_temperature_allows_shading: >
    {{
      (room_temperature_entities | length == 0)
      or
      (
        (room_temperature | float(-999))
        >=
        (global_shading_room_temperature | float)
      )
    }}


  # ===========================================================================
  # BEWÖLKUNG
  # ===========================================================================

  cloud_coverage: >
    {{
      state_attr(weather_entity, 'cloud_coverage')
      | float(100)
    }}


  # ===========================================================================
  # GLOBALBESCHATTUNG
  # ===========================================================================

  global_shading_active: >
    {{
      global_shading_enabled | bool
      and
      daytime_active | bool
      and
      (outdoor_temperature | float(-999))
        >=
      (global_shading_temperature | float)
      and
      (cloud_coverage | float(100))
        <=
      (global_shading_cloud_coverage | float)
      and
      room_temperature_allows_shading | bool
    }}


  # ===========================================================================
  # NORMALER SOLLZUSTAND
  # ===========================================================================

  desired_position: >
    {% if reference_cover_requests_close | bool %}

      0

    {% elif not (daytime_active | bool) %}

      0

    {% elif global_shading_active | bool %}

      {{ global_shading_position | int }}

    {% else %}

      100

    {% endif %}


  # ===========================================================================
  # FENSTERZUSTÄNDE
  # ===========================================================================

  handle_is_open: >
    {{
      window_handle_sensor | length > 0
      and
      expand(window_handle_sensor)
        | selectattr('state', 'eq', 'open')
        | list
        | count > 0
    }}


  handle_is_tilted: >
    {{
      window_handle_sensor | length > 0
      and
      expand(window_handle_sensor)
        | selectattr('state', 'eq', 'tilted')
        | list
        | count > 0
    }}


  window_is_open: >
    {{
      window_open_sensor | length > 0
      and
      expand(window_open_sensor)
        | selectattr('state', 'eq', 'on')
        | list
        | count > 0
    }}



# =============================================================================
# CONDITIONS
# =============================================================================

conditions: []



# =============================================================================
# ACTIONS
# =============================================================================

actions:


  # ===========================================================================
  # PRIORITÄT 1
  #
  # AUSSperrSCHUTZ: OPEN
  #
  # Das Rollo muss auf 100 fahren.
  #
  # Auch dieser Fahrbefehl besitzt Retry:
  #
  #   maximal 10 Versuche
  #   jeweils 3 Sekunden Abstand
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id: handle_open

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: 100


                # -------------------------------------------------------------
                # Aktor bekommt Zeit, den Befehl zu verarbeiten und seine
                # Position an Home Assistant zurückzumelden.
                # -------------------------------------------------------------

                - delay:
                    seconds: 3


              until:

                # Ziel erreicht
                # ODER
                # maximal 10 Versuche durchgeführt

                - condition: template
                  value_template: >
                    {{
                      (state_attr(cover_entity, 'current_position') | int(-1))
                      >= 99
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Aussperrschutz ausgeführt.
              Rollladen sollte vollständig geöffnet sein.



  # ===========================================================================
  # OPEN -> TILTED
  #
  # BESONDERER FALL:
  #
  # Das Fenster war vollständig OPEN.
  #
  # Dadurch wurde der Aussperrschutz aktiviert und das Rollo auf
  # Position 100 gefahren.
  #
  # Wird das Fenster anschließend auf TILTED gestellt, soll das Rollo
  # NICHT auf 100 bleiben.
  #
  # Es darf jetzt auf die konfigurierte Lüftungs-/Schutzposition fahren.
  #
  # Dieser Übergang darf also AUSNAHMSWEISE auch eine Schließbewegung
  # auslösen.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id: handle_tilted

          - condition: template
            value_template: >
              {{
                trigger.from_state is not none
                and
                trigger.from_state.state == 'open'
              }}

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: "{{ protection_position | int }}"


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (
                        (
                          state_attr(cover_entity, 'current_position')
                          | int(-1)
                        )
                        -
                        (protection_position | int)
                      )
                      | abs
                      <= 2
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Fenster wechselte von OPEN auf TILTED.
              Aussperrschutz aufgehoben und Lüftungsposition angefahren.



  # ===========================================================================
  # NORMALER TILTED / WINDOW OPEN SCHUTZ
  #
  # Bei:
  #
  #   CLOSED -> TILTED
  #
  # oder:
  #
  #   Zwei-Zustands-Sensor -> OPEN
  #
  # wird nur dann gefahren, wenn das Rollo aktuell WEITER GESCHLOSSEN
  # als die Schutzposition ist.
  #
  # Ein bereits weiter geöffnetes Rollo bleibt unverändert.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id:
              - handle_tilted
              - window_open

          - condition: template
            value_template: >
              {{
                (state_attr(cover_entity, 'current_position') | int(0))
                <
                (protection_position | int)
              }}

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: "{{ protection_position | int }}"


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (state_attr(cover_entity, 'current_position') | int(-1))
                      >=
                      (protection_position | int)
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Fenster-/Lüftungsschutz ausgeführt.
              Rollladen bis zur Schutzposition geöffnet.



  # ===========================================================================
  # TILTED / WINDOW OPEN ABER SCHUTZ BEREITS ERFÜLLT
  #
  # WICHTIG:
  #
  # OPEN -> TILTED wurde bereits weiter oben separat behandelt.
  #
  # In allen anderen Fällen soll ein weiter geöffnetes Rollo durch
  # das Öffnen/Kippen des Fensters NICHT geschlossen werden.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id:
              - handle_tilted
              - window_open

        sequence:

          - stop: >
              Fenster-/Lüftungsschutz bereits erfüllt.
              Rollladen bleibt auf seiner aktuellen Position.



  # ===========================================================================
  # PRIORITÄT 2
  #
  # MANUAL OVERRIDE
  # ===========================================================================

  - if:

      - condition: template
        value_template: >
          {{ manual_override | bool }}

    then:

      - stop: >
          Manuelle Bedienung innerhalb der letzten 15 Minuten erkannt.
          Automatische Positionsänderung unterdrückt.



  # ===========================================================================
  # ZIELPOSITION
  #
  # Hier wird der normale Sollzustand mit dem AKTUELLEN Fensterzustand
  # kombiniert.
  #
  # OPEN:
  #
  #     100
  #
  # TILTED:
  #
  #     mindestens protection_position
  #
  # Zwei-Zustands-Sensor OPEN:
  #
  #     mindestens protection_position
  #
  # CLOSED:
  #
  #     normaler Sollzustand
  # ===========================================================================

  - variables:

      target_position: >
        {% set desired = desired_position | int %}
        {% set protection = protection_position | int %}

        {% if handle_is_open | bool %}

          100

        {% elif handle_is_tilted | bool %}

          {{ [desired, protection] | max }}

        {% elif window_is_open | bool %}

          {{ [desired, protection] | max }}

        {% else %}

          {{ desired }}

        {% endif %}



  # ===========================================================================
  # NUR FAHREN, WENN IST != SOLL
  # ===========================================================================

  - condition: template

    value_template: >
      {{
        (
          (
            state_attr(cover_entity, 'current_position')
            | int(-1)
          )
          -
          (target_position | int)
        )
        | abs
        > 2
      }}



  # ===========================================================================
  # NORMALER FAHRBEFEHL MIT RETRY
  #
  # Es werden maximal 10 Versuche durchgeführt.
  #
  # Nach jedem Fahrbefehl:
  #
  #   3 Sekunden warten
  #
  # Danach wird current_position geprüft.
  #
  # Toleranz:
  #
  #   +/- 2 %
  #
  # Die Toleranz verhindert unnötige Wiederholungen bei Aktoren,
  # die beispielsweise statt 40 % einen Wert von 39 % oder 41 %
  # zurückmelden.
  #
  # continue_on_error verhindert, dass ein Kommunikationsfehler beim
  # Service-Aufruf die komplette Automation sofort beendet.
  # ===========================================================================

  - repeat:

      sequence:

        - action: cover.set_cover_position
          continue_on_error: true

          target:
            entity_id: !input my_cover

          data:
            position: "{{ target_position | int }}"


        - delay:
            seconds: 3


      until:

        - condition: template
          value_template: >
            {{
              (
                (
                  state_attr(cover_entity, 'current_position')
                  | int(-999)
                )
                -
                (target_position | int)
              )
              | abs
              <= 2
              or
              repeat.index >= 10
            }}



# =============================================================================
# AUTOMATION MODE
# =============================================================================

mode: restart

max_exceeded: silent