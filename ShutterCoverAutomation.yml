# =============================================================================
# ShutterCoverAutomation.yml
#
# VERSION: 0.1.0
#
# Features
# --------
#
# - Sunrise / Sunset
# - Workday Sensor
# - Feiertage über Workday Sensor
# - Früheste Öffnungszeiten
# - Türschutz
# - Verzögerung nach Türschließung
# - Manuelle Übersteuerung über Shelly Inputs
# - Kühlung
# - Azimutbasierte Beschattung
# - Globalbeschattung ab 28°C
# - Logbook Integration
# - Beschattung aufheben 1h vor Sonnenuntergang
#
# PRIORITÄTEN
#
# 1. Manual Override
# 2. Aussperrschutz
# 3. Globalbeschattung >= 28°C
# 4. Normale Beschattung
# 5. Sunrise / Sunset
#
# =============================================================================

blueprint:

  name: Shutter Cover Automation Enterprise

  description: >

    Enterprise Blueprint für Rollos:

    - Sunrise/Sunset
    - Workday Sensor
    - Holiday Support
    - Manual Override
    - Cooling
    - Global Shading
    - Azimuth Profiles
    - Logbook Integration

  domain: automation
  author: Jonny.S@gmx.de
  homeassistant:
    min_version: 2026.8.0
  source_url: https://raw.githubusercontent.com/elbrondor/MyBlueprints/refs/heads/master/ShutterCoverAutomation.yml

# =============================================================================
# INPUTS
# =============================================================================

  input:
    assignment_section:
      name: Grundeinstellungen
      description: Grundlegende Einstellungen für das zu Steuernde Rollo
      icon: mdi:vector-link
      input:
        my_cover:
          name: Rollo
          description: Das zu Steuernde Rollo
          selector:
            entity:
              domain:
              - cover
              multiple: false
              reorder: false



# =============================================================================
# MODE
# =============================================================================

mode: restart


# =============================================================================
# VARIABLES
# =============================================================================

variables:

  cover_entity: !input cover_entity

  workday_sensor: !input workday_sensor

  weather_entity: !input weather_entity

  outdoor_temperature_sensor: !input outdoor_temperature_sensor

  door_sensor: !input door_sensor

  manual_override_entity_1: !input manual_override_entity_1

  manual_override_entity_2: !input manual_override_entity_2

  manual_override_active: >

    {% set t1 =
       as_timestamp(states[manual_override_entity_1].last_changed)
       if manual_override_entity_1 != ''
       else 0 %}

    {% set t2 =
       as_timestamp(states[manual_override_entity_2].last_changed)
       if manual_override_entity_2 != ''
       else 0 %}

    {% set latest = [t1,t2]|max %}

    {{ (as_timestamp(now()) - latest) < 900 }}

  is_workday: >

    {{ is_state(workday_sensor,'on') }}

  sun_azimuth: >

    {{ state_attr('sun.sun','azimuth') | float(0) }}

  sun_elevation: >

    {{ state_attr('sun.sun','elevation') | float(0) }}

  global_shading_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      28
    }}

  cooling_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      24
    }}

  weather_ok: >

    {{
      states(weather_entity)
      in
      [
        'sunny',
        'clear',
        'partlycloudy'
      ]
    }}

# =============================================================================
# TRIGGERS
# =============================================================================

trigger:

  - platform: sun
    event: sunrise
    offset: !input sunrise_offset
    id: sunrise
