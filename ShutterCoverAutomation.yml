# =============================================================================
# ShutterCoverAutomation.yml
#
# VERSION: 0.3.6
#
# Home Assistant Blueprint zur automatischen Steuerung von Rollläden.
#
# Cover Position:
#     0 = vollständig geschlossen
#   100 = vollständig geöffnet
#
# PRIORITÄTEN
#
# 1. Aktiver Fenster-/Aussperrschutz
# 2. Sonderfall Sonnenaufgang vor frühester Öffnungszeit
# 3. Manuelle/externe Übersteuerung
# 4. Globalbeschattung
# 5. Normaler Tages-/Nachtbetrieb
#
# Fahrbefehle:
# - maximal 10 Versuche
# - 3 Sekunden zwischen den Versuchen
# - tatsächliche current_position wird geprüft
#
# =============================================================================

blueprint:
  name: Shutter Cover Automation

  description: >
    Automatische Rollladensteuerung mit Sonnenaufgang/Sonnenuntergang,
    Workday-Unterstützung, Aussperr-/Lüftungsschutz, manueller
    Übersteuerung, Globalbeschattung, Sunrise-Offset, Schlafzimmer-
    Sonderfunktion und automatischer Wiederholung fehlgeschlagener
    Fahrbefehle.

  domain: automation

  author: Jonny.S@gmx.de

  homeassistant:
    min_version: 2026.8.0

  source_url: https://raw.githubusercontent.com/elbrondor/MyBlueprints/refs/heads/master/ShutterCoverAutomation.yml


  # ===========================================================================
  # INPUTS
  # ===========================================================================

  input:


    # =========================================================================
    # GRUNDEINSTELLUNGEN
    # =========================================================================

    assignment_section:

      name: Grundeinstellungen

      icon: mdi:window-shutter

      input:


        my_cover:

          name: Rollo

          description: >
            Der zu steuernde Rollladen.

            0 %   = vollständig geschlossen
            100 % = vollständig geöffnet

          selector:
            entity:
              domain:
                - cover
              multiple: false


        my_window_open_sensor:

          name: Fenster-/Türsensor (2 Zustände)

          description: >
            Optionaler einfacher Fenster-/Türkontakt.

            on  = geöffnet
            off = geschlossen

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                  device_class:
                    - door
                    - window
              multiple: true


        my_window_handle_sensor:

          name: Fenster-/Türgriff (3 Zustände)

          description: >
            Optionaler Sensor mit den Zuständen:

            open
            tilted
            closed

            open:
            vollständiger Aussperrschutz.

            tilted:
            Lüftungsschutz.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
              multiple: true


        my_protection_close_percentage:

          name: Maximale Schließung bei Lüftungsschutz

          description: >
            Gibt an, wie weit der Rollladen bei gekipptem Fenster
            oder geöffnetem Zwei-Zustands-Sensor maximal geschlossen
            sein darf.

            Beispiel:

            60 % geschlossen entspricht Cover-Position 40 %.

          default: 60

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider


        my_protection_delay:

          name: Verzögerung Fenster-/Türschutz

          description: >
            Wie lange muss der neue Fenster-/Türzustand stabil
            anliegen, bevor darauf reagiert wird?

          default: 10

          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "s"
              mode: slider




    # =========================================================================
    # ÜBERSTEUERUNG
    # =========================================================================

    override_section:

      name: Übersteuerung

      description: >
        Einstellungen für die manuelle oder externe Übersteuerung.
        Änderungen an ausgewählten Eingangs-Entitäten sowie das Ausführen
        ausgewählter Automationen pausieren die normale Rollladenautomatik.
        Der Fenster-/Aussperrschutz besitzt weiterhin höhere Priorität.

      icon: mdi:hand-back-right

      collapsed: true

      input:

        my_override_entities:

          name: Lokale Rollladenschalter

          description: >
            Liste von Sensoren oder Eingängen, deren Zustandsänderung als
            manuelle Bedienung gewertet wird.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                - domain:
                    - sensor
              multiple: true


        my_override_automations:

          name: Übersteuernde Automationen

          description: >
            Liste von Automationen, deren Ausführung die automatische
            Rollladensteuerung für die konfigurierte Zeit übersteuert.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - automation
              multiple: true


        my_override_duration:

          name: Dauer der Übersteuerung

          description: >
            Dauer, für die nach einer manuellen Bedienung oder dem Ausführen
            einer ausgewählten Automation die normale Rollladenautomatik
            pausiert.

          default: 15

          selector:
            number:
              min: 1
              max: 180
              step: 1
              unit_of_measurement: "min"
              mode: box


    # =========================================================================
    # SONNENAUFGANG / ÖFFNEN
    # =========================================================================

    sunrise_section:

      name: Sonnenaufgang / Öffnen

      description: >
        Einstellungen für das automatische Öffnen der Rollläden
        am Morgen.

        Hier kann festgelegt werden, wann die Rollläden an Arbeitstagen
        sowie an Wochenenden und Feiertagen frühestens geöffnet werden.

        Zusätzlich kann verhindert werden, dass ein bereits geöffnetes
        oder gekipptes Fenster beim Sonnenaufgang zu einem vorzeitigen
        Öffnen des Rollladens führt.

      icon: mdi:weather-sunset-up

      collapsed: true

      input:


        my_is_workday:

          name: Workday Sensor

          description: >
            Sensor zur Unterscheidung zwischen Arbeitstagen und
            Wochenenden bzw. Feiertagen.

            on  = Arbeitstag
            off = Wochenende oder Feiertag

          default: binary_sensor.workday_sensor

          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
              multiple: false


        my_early_open_wd:

          name: Frühestes Öffnen an Arbeitstagen

          description: >
            Vor dieser Uhrzeit wird der Rollladen an Arbeitstagen
            nicht aufgrund des Sonnenaufgangs geöffnet.

          default: "07:00:00"

          selector:
            time:


        my_early_open_we:

          name: Frühestes Öffnen am Wochenende / Feiertag

          description: >
            Vor dieser Uhrzeit wird der Rollladen an Wochenenden
            und Feiertagen nicht aufgrund des Sonnenaufgangs geöffnet.

          default: "08:00:00"

          selector:
            time:



        my_sunrise_offset:

          name: Offset zum Sonnenaufgang

          description: >
            Verschiebt die automatische Öffnung relativ zum Sonnenaufgang.
            Negative Werte öffnen früher, positive Werte später.
            Die konfigurierte früheste Öffnungszeit wird niemals
            unterschritten.

            Beispiele:
            -00:30:00 = 30 Minuten vor Sonnenaufgang
             00:00:00 = genau bei Sonnenaufgang
             00:30:00 = 30 Minuten nach Sonnenaufgang

          default: "00:00:00"

          selector:
            text:


        my_keep_closed_between_sunrise_and_earliest_open:

          name: Bei frühem Sonnenaufgang geschlossen halten

          description: >
            Ist diese Option aktiviert und der Sonnenaufgang liegt vor
            der konfigurierten frühesten Öffnungszeit, wird der Rollladen
            beim Sonnenaufgang vollständig geschlossen.

            Dies gilt auch dann, wenn das Fenster bereits vor dem
            Sonnenaufgang geöffnet oder gekippt war und der Rollladen
            deshalb durch den Aussperr- oder Lüftungsschutz geöffnet ist.

            Wird das Fenster NACH dem Sonnenaufgang erneut geöffnet oder
            gekippt, greift der Aussperr-/Lüftungsschutz wieder normal.

            Bei Erreichen der frühesten Öffnungszeit wird ebenfalls der
            aktuelle Fensterzustand wieder berücksichtigt.

            Diese Funktion ist insbesondere für Schlafzimmer gedacht,
            damit es zwischen einem frühen Sonnenaufgang und der
            gewünschten Aufstehzeit dunkel bleibt.

          default: false

          selector:
            boolean:



    # =========================================================================
    # SONNENUNTERGANG
    # =========================================================================

    sunset_section:

      name: Sonnenuntergang

      icon: mdi:weather-sunset-down

      input:


        my_down_offset:

          name: Offset zum Sonnenuntergang

          description: >
            Beispiele:

            -01:00:00 = eine Stunde vorher
            -00:30:00 = 30 Minuten vorher
             00:00:00 = genau bei Sonnenuntergang
             00:30:00 = 30 Minuten danach
             01:00:00 = eine Stunde danach

          default: "00:00:00"

          selector:
            text:




    # =========================================================================
    # GLOBALBESCHATTUNG
    # =========================================================================

    global_shading_section:

      name: Globalbeschattung

      description: >
        Temperatur-, Raumtemperatur- und bewölkungsabhängige
        Globalbeschattung.

      icon: mdi:weather-sunny-alert

      collapsed: true

      input:


        my_global_shading_enabled:

          name: Globalbeschattung aktivieren

          default: true

          selector:
            boolean:


        my_outdoor_temperature:

          name: Außentemperatur

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: true


        my_global_shading_temperature:

          name: Temperaturgrenze außen

          description: >
            Ab dieser Außentemperatur darf die Globalbeschattung
            aktiviert werden.

          default: 28

          selector:
            number:
              min: 15
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider


        my_weather:

          name: Wetter

          description: >
            Wetter-Entität zur Ermittlung des Attributes cloud_coverage.

          default: weather.forecast_home

          selector:
            entity:
              filter:
                - domain:
                    - weather
              multiple: false


        my_global_shading_cloud_coverage:

          name: Maximale Bewölkung

          description: >
            Bis zu diesem Bewölkungsgrad darf die Globalbeschattung
            aktiviert werden.

            0 %   = wolkenlos
            100 % = vollständig bewölkt

          default: 40

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider


        my_room_temperature:

          name: Raumtemperatur

          description: >
            Optionaler Temperatursensor für den Raum.

            Wird kein Sensor ausgewählt, wird die Raumtemperatur
            nicht berücksichtigt.

          default: []

          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class:
                    - temperature
              multiple: true


        my_global_shading_room_temperature:

          name: Mindest-Raumtemperatur

          description: >
            Erst ab dieser Raumtemperatur darf die Globalbeschattung
            aktiviert werden.

          default: 23

          selector:
            number:
              min: 15
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider


        my_global_shading_position:

          name: Rollladenposition bei Globalbeschattung

          description: >
            0 %   = vollständig geschlossen
            100 % = vollständig geöffnet

          default: 30

          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider



# =============================================================================
# TRIGGER
# =============================================================================

triggers:


  # ---------------------------------------------------------------------------
  # SONNENAUFGANG
  # ---------------------------------------------------------------------------

  # Tatsächlicher Sonnenaufgang: nur für die Schlafzimmer-Sonderfunktion
  - trigger: sun
    event: sunrise
    id: actual_sunrise

  # Normale Öffnungslogik mit konfigurierbarem Offset
  - trigger: sun
    event: sunrise
    offset: !input my_sunrise_offset
    id: sunrise_offset


  # ---------------------------------------------------------------------------
  # FRÜHESTE ÖFFNUNGSZEIT
  # ---------------------------------------------------------------------------

  - trigger: time
    at: !input my_early_open_wd
    id: early_open_wd


  - trigger: time
    at: !input my_early_open_we
    id: early_open_we


  # ---------------------------------------------------------------------------
  # SONNENUNTERGANG
  # ---------------------------------------------------------------------------

  - trigger: sun
    event: sunset
    offset: !input my_down_offset
    id: sunset



  # ---------------------------------------------------------------------------
  # DREI-ZUSTANDS-FENSTERSENSOR
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "open"
    for:
      seconds: !input my_protection_delay
    id: handle_open


  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "tilted"
    for:
      seconds: !input my_protection_delay
    id: handle_tilted


  - trigger: state
    entity_id: !input my_window_handle_sensor
    to: "closed"
    for:
      seconds: !input my_protection_delay
    id: handle_closed


  # ---------------------------------------------------------------------------
  # ZWEI-ZUSTANDS-FENSTERSENSOR
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_window_open_sensor
    to: "on"
    for:
      seconds: !input my_protection_delay
    id: window_open


  - trigger: state
    entity_id: !input my_window_open_sensor
    to: "off"
    for:
      seconds: !input my_protection_delay
    id: window_closed


  # ---------------------------------------------------------------------------
  # GLOBALBESCHATTUNG
  # ---------------------------------------------------------------------------

  - trigger: state
    entity_id: !input my_outdoor_temperature
    id: global_shading_temperature_change


  - trigger: state
    entity_id: !input my_room_temperature
    id: global_shading_room_temperature_change


  - trigger: state
    entity_id: !input my_weather
    attribute: cloud_coverage
    id: global_shading_cloud_change



# =============================================================================
# VARIABLEN
# =============================================================================

variables:


  # ===========================================================================
  # ENTITÄTEN
  # ===========================================================================

  cover_entity: !input my_cover

  window_open_sensor: !input my_window_open_sensor
  window_handle_sensor: !input my_window_handle_sensor

  override_entities: !input my_override_entities
  override_automations: !input my_override_automations

  workday_sensor: !input my_is_workday


  outdoor_temperature_entities: !input my_outdoor_temperature
  room_temperature_entities: !input my_room_temperature

  weather_entity: !input my_weather


  # ===========================================================================
  # KONFIGURATION
  # ===========================================================================

  early_open_wd: !input my_early_open_wd
  early_open_we: !input my_early_open_we

  sunrise_offset: !input my_sunrise_offset
  sunset_offset: !input my_down_offset

  override_duration: !input my_override_duration

  protection_close_percentage: !input my_protection_close_percentage

  keep_closed_between_sunrise_and_earliest_open:
    !input my_keep_closed_between_sunrise_and_earliest_open


  global_shading_enabled: !input my_global_shading_enabled
  global_shading_temperature: !input my_global_shading_temperature
  global_shading_cloud_coverage: !input my_global_shading_cloud_coverage
  global_shading_room_temperature: !input my_global_shading_room_temperature
  global_shading_position: !input my_global_shading_position


  # ===========================================================================
  # SCHUTZ-/LÜFTUNGSPOSITION
  # ===========================================================================

  protection_position: >
    {{ 100 - (protection_close_percentage | int(60)) }}


  # ===========================================================================
  # FRÜHESTE ÖFFNUNGSZEIT HEUTE
  # ===========================================================================

  earliest_open_today: >
    {% if is_state(workday_sensor, 'on') %}
      {{ today_at(early_open_wd) }}
    {% else %}
      {{ today_at(early_open_we) }}
    {% endif %}


  # ===========================================================================
  # SONNENAUFGANG-SONDERFALL
  #
  # Nur TRUE, wenn:
  #
  # - Funktion aktiviert
  # - aktueller Trigger = Sonnenaufgang
  # - früheste Öffnungszeit noch nicht erreicht
  #
  # Ein späteres Öffnen/Kippen erzeugt einen neuen Trigger und aktiviert
  # damit wieder den normalen Fenster-/Aussperrschutz.
  # ===========================================================================

  sunrise_keep_closed: >
    {{
      keep_closed_between_sunrise_and_earliest_open | bool
      and
      trigger.id == 'actual_sunrise'
      and
      now() < (earliest_open_today | as_datetime)
    }}


  # ===========================================================================
  # MANUELLE / EXTERNE ÜBERSTEUERUNG
  # ===========================================================================

  manual_override: >
    {% set ns = namespace(active=false) %}
    {% set duration = (override_duration | int(15)) * 60 %}

    {% for entity in override_entities %}
      {% if states[entity] is defined %}
        {% if (now() - states[entity].last_changed).total_seconds() < duration %}
          {% set ns.active = true %}
        {% endif %}
      {% endif %}
    {% endfor %}

    {% for entity in override_automations %}
      {% set last_triggered = state_attr(entity, 'last_triggered') %}
      {% if last_triggered is not none %}
        {% if (now() - as_datetime(last_triggered)).total_seconds() < duration %}
          {% set ns.active = true %}
        {% endif %}
      {% endif %}
    {% endfor %}

    {{ ns.active }}


  # ===========================================================================
  # SUNRISE-OFFSET IN SEKUNDEN
  # ===========================================================================

  sunrise_offset_seconds: >
    {% set value = sunrise_offset | string %}
    {% if value.startswith('-') %}
      {% set sign = -1 %}
      {% set value = value[1:] %}
    {% elif value.startswith('+') %}
      {% set sign = 1 %}
      {% set value = value[1:] %}
    {% else %}
      {% set sign = 1 %}
    {% endif %}
    {% set parts = value.split(':') %}
    {{
      sign *
      (
        (parts[0] | int(0)) * 3600
        + (parts[1] | int(0)) * 60
        + (parts[2] | int(0))
      )
    }}


  # ===========================================================================
  # SUNSET-OFFSET IN SEKUNDEN
  # ===========================================================================
  # SUNSET-OFFSET IN SEKUNDEN
  # ===========================================================================

  sunset_offset_seconds: >
    {% set value = sunset_offset | string %}

    {% if value.startswith('-') %}
      {% set sign = -1 %}
      {% set value = value[1:] %}
    {% elif value.startswith('+') %}
      {% set sign = 1 %}
      {% set value = value[1:] %}
    {% else %}
      {% set sign = 1 %}
    {% endif %}

    {% set parts = value.split(':') %}

    {{
      sign *
      (
        (parts[0] | int(0)) * 3600
        +
        (parts[1] | int(0)) * 60
        +
        (parts[2] | int(0))
      )
    }}


  # ===========================================================================
  # TAGESBETRIEB
  #
  # Öffnungszeit = späterer Zeitpunkt aus:
  # - Sonnenaufgang + Offset
  # - frühester Öffnungszeit
  # ===========================================================================

  daytime_active: >
    {% set rise_offset = sunrise_offset_seconds | int(0) %}
    {% set down_offset = sunset_offset_seconds | int(0) %}

    {% if is_state(workday_sensor, 'on') %}
      {% set earliest_open = today_at(early_open_wd) %}
    {% else %}
      {% set earliest_open = today_at(early_open_we) %}
    {% endif %}

    {% set next_rising = as_datetime(state_attr('sun.sun', 'next_rising')) | as_local %}
    {% if next_rising.date() == now().date() %}
      {% set base_rising = next_rising %}
    {% else %}
      {% set base_rising = next_rising - timedelta(days=1) %}
    {% endif %}
    {% set offset_rising = base_rising + timedelta(seconds=rise_offset) %}
    {% set effective_open = [earliest_open, offset_rising] | max %}

    {% if now() < effective_open %}
      false
    {% elif is_state('sun.sun', 'above_horizon') %}
      {% if down_offset < 0 %}
        {% set next_setting =
             as_datetime(state_attr('sun.sun', 'next_setting'))
             | as_local %}
        {{ now() < (next_setting + timedelta(seconds=down_offset)) }}
      {% else %}
        true
      {% endif %}
    {% else %}
      {# Vor Sonnenaufgang kann ein negativer Sunrise-Offset den Tagesbetrieb
         bereits aktivieren. Nach Sonnenuntergang gilt dagegen nur ein
         positiver Sunset-Offset. #}
      {% if now() < base_rising %}
        {{ now() >= effective_open }}
      {% elif down_offset > 0 %}
        {{
          now()
          <
          (
            states['sun.sun'].last_changed
            +
            timedelta(seconds=down_offset)
          )
        }}
      {% else %}
        false
      {% endif %}
    {% endif %}



  # ===========================================================================
  # AUSSENTEMPERATUR
  # ===========================================================================
  # AUSSENTEMPERATUR
  # ===========================================================================

  outdoor_temperature: >
    {% if outdoor_temperature_entities | length > 0 %}

      {{
        states(outdoor_temperature_entities[0])
        | float(-999)
      }}

    {% else %}

      -999

    {% endif %}


  # ===========================================================================
  # RAUMTEMPERATUR
  # ===========================================================================

  room_temperature: >
    {% if room_temperature_entities | length > 0 %}

      {{
        states(room_temperature_entities[0])
        | float(-999)
      }}

    {% else %}

      -999

    {% endif %}


  # ===========================================================================
  # RAUMTEMPERATUR ERLAUBT BESCHATTUNG?
  # ===========================================================================

  room_temperature_allows_shading: >
    {{
      (room_temperature_entities | length == 0)
      or
      (
        (room_temperature | float(-999))
        >=
        (global_shading_room_temperature | float)
      )
    }}


  # ===========================================================================
  # BEWÖLKUNG
  # ===========================================================================

  cloud_coverage: >
    {{
      state_attr(weather_entity, 'cloud_coverage')
      | float(100)
    }}


  # ===========================================================================
  # GLOBALBESCHATTUNG
  # ===========================================================================

  global_shading_active: >
    {{
      global_shading_enabled | bool
      and
      daytime_active | bool
      and
      (outdoor_temperature | float(-999))
        >=
      (global_shading_temperature | float)
      and
      (cloud_coverage | float(100))
        <=
      (global_shading_cloud_coverage | float)
      and
      room_temperature_allows_shading | bool
    }}


  # ===========================================================================
  # NORMALER SOLLZUSTAND
  # ===========================================================================

  desired_position: >
    {% if not (daytime_active | bool) %}

      0

    {% elif global_shading_active | bool %}

      {{ global_shading_position | int }}

    {% else %}

      100

    {% endif %}


  # ===========================================================================
  # FENSTERZUSTÄNDE
  # ===========================================================================

  handle_is_open: >
    {{
      window_handle_sensor | length > 0
      and
      expand(window_handle_sensor)
        | selectattr('state', 'eq', 'open')
        | list
        | count > 0
    }}


  handle_is_tilted: >
    {{
      window_handle_sensor | length > 0
      and
      expand(window_handle_sensor)
        | selectattr('state', 'eq', 'tilted')
        | list
        | count > 0
    }}


  window_is_open: >
    {{
      window_open_sensor | length > 0
      and
      expand(window_open_sensor)
        | selectattr('state', 'eq', 'on')
        | list
        | count > 0
    }}



# =============================================================================
# CONDITIONS
# =============================================================================

conditions: []



# =============================================================================
# ACTIONS
# =============================================================================

actions:


  # ===========================================================================
  # SONDERFALL:
  #
  # SONNENAUFGANG VOR FRÜHESTER ÖFFNUNGSZEIT
  #
  # Beispiel:
  #
  # Sonnenaufgang:       06:15
  # früheste Öffnung:    07:30
  #
  # War das Fenster bereits nachts OPEN oder TILTED und stand der
  # Rollladen deshalb auf 100 bzw. auf der Lüftungsposition, wird er
  # beim Sonnenaufgang vollständig geschlossen.
  #
  # WICHTIG:
  #
  # Dies geschieht ausschließlich beim SUNRISE-Trigger.
  #
  # Wird das Fenster anschließend neu geöffnet/gekippt, greifen die
  # normalen Schutz-Trigger wieder.
  #
  # Retry:
  #   maximal 10 Versuche
  #   3 Sekunden Abstand
  # ===========================================================================

  - choose:

      - conditions:

          - condition: template
            value_template: >
              {{ sunrise_keep_closed | bool }}

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: 0


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (
                        state_attr(cover_entity, 'current_position')
                        | int(-999)
                      )
                      <= 2
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Sonnenaufgang vor frühester Öffnungszeit.
              Rollladen wurde vollständig geschlossen.



  # ===========================================================================
  # PRIORITÄT 1:
  # AUSSperrSCHUTZ BEI OPEN
  #
  # Ein NEUES Open-Ereignis besitzt höchste Priorität.
  #
  # Dadurch gilt auch:
  #
  # 06:15 Sunrise -> Rollo geschlossen
  # 06:45 Fenster wird OPEN
  # -> Rollo fährt auf 100 %
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id: handle_open

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: 100


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (
                        state_attr(cover_entity, 'current_position')
                        | int(-1)
                      )
                      >= 98
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Aussperrschutz ausgeführt.
              Rollladen vollständig geöffnet.



  # ===========================================================================
  # OPEN -> TILTED
  #
  # War das Fenster vollständig OPEN, stand der Rollladen aufgrund
  # des Aussperrschutzes auf 100 %.
  #
  # Beim Wechsel auf TILTED darf er auf die Lüftungsposition fahren.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id: handle_tilted

          - condition: template
            value_template: >
              {{
                trigger.from_state is not none
                and
                trigger.from_state.state == 'open'
              }}

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: "{{ protection_position | int }}"


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (
                        (
                          state_attr(cover_entity, 'current_position')
                          | int(-999)
                        )
                        -
                        (protection_position | int)
                      )
                      | abs
                      <= 2
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Fenster wechselte von OPEN auf TILTED.
              Lüftungsposition angefahren.



  # ===========================================================================
  # NORMALER TILTED / WINDOW OPEN SCHUTZ
  #
  # Ist das Rollo weiter geschlossen als die Schutzposition,
  # wird es bis zur Schutzposition geöffnet.
  #
  # Ein bereits weiter geöffnetes Rollo wird NICHT geschlossen.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id:
              - handle_tilted
              - window_open

          - condition: template
            value_template: >
              {{
                (
                  state_attr(cover_entity, 'current_position')
                  | int(0)
                )
                <
                (protection_position | int)
              }}

        sequence:

          - repeat:

              sequence:

                - action: cover.set_cover_position
                  continue_on_error: true

                  target:
                    entity_id: !input my_cover

                  data:
                    position: "{{ protection_position | int }}"


                - delay:
                    seconds: 3


              until:

                - condition: template
                  value_template: >
                    {{
                      (
                        state_attr(cover_entity, 'current_position')
                        | int(-1)
                      )
                      >=
                      ((protection_position | int) - 2)
                      or
                      repeat.index >= 10
                    }}


          - stop: >
              Fenster-/Lüftungsschutz ausgeführt.
              Schutzposition angefahren.



  # ===========================================================================
  # TILTED / WINDOW OPEN, SCHUTZ BEREITS ERFÜLLT
  #
  # Beispiel:
  #
  # Rollo aktuell:       80 %
  # Schutzposition:      40 %
  # Fenster wird tilted
  #
  # -> Rollo bleibt bei 80 %
  #
  # Die Ausnahme OPEN -> TILTED wurde bereits oben behandelt.
  # ===========================================================================

  - choose:

      - conditions:

          - condition: trigger
            id:
              - handle_tilted
              - window_open

        sequence:

          - stop: >
              Fenster-/Lüftungsschutz bereits erfüllt.
              Rollladen bleibt auf seiner aktuellen Position.



  # ===========================================================================
  # MANUELLE / EXTERNE ÜBERSTEUERUNG
  #
  # Sicherheitsrelevante neue Fensterereignisse wurden bereits behandelt.
  # ===========================================================================

  - if:

      - condition: template
        value_template: >
          {{ manual_override | bool }}

    then:

      - stop: >
          Manuelle oder externe Übersteuerung aktiv.
          Automatische Positionsänderung wird für die konfigurierte Dauer
          unterdrückt.



  # ===========================================================================
  # ZIELPOSITION
  #
  # Der normale Sollzustand wird mit dem AKTUELLEN Fensterzustand kombiniert.
  #
  # Besonders wichtig beim Erreichen der frühesten Öffnungszeit:
  #
  # CLOSED:
  #     normaler Tages-Sollwert
  #
  # TILTED:
  #     mindestens protection_position
  #
  # OPEN:
  #     100 %
  #
  # Der Sunrise-Sonderfall wurde zu diesem Zeitpunkt bereits oben behandelt
  # und mit STOP beendet.
  # ===========================================================================

  - variables:

      target_position: >
        {% set desired = desired_position | int %}
        {% set protection = protection_position | int %}

        {% if handle_is_open | bool %}

          100

        {% elif handle_is_tilted | bool %}

          {{ [desired, protection] | max }}

        {% elif window_is_open | bool %}

          {{ [desired, protection] | max }}

        {% else %}

          {{ desired }}

        {% endif %}



  # ===========================================================================
  # NUR FAHREN, WENN IST UND SOLL MEHR ALS 2 % ABWEICHEN
  # ===========================================================================

  - condition: template

    value_template: >
      {{
        (
          (
            state_attr(cover_entity, 'current_position')
            | int(-999)
          )
          -
          (target_position | int)
        )
        | abs
        > 2
      }}



  # ===========================================================================
  # NORMALER FAHRBEFEHL MIT RETRY
  #
  # maximal 10 Versuche
  # 3 Sekunden zwischen den Versuchen
  # +/- 2 % Toleranz
  # ===========================================================================

  - repeat:

      sequence:

        - action: cover.set_cover_position
          continue_on_error: true

          target:
            entity_id: !input my_cover

          data:
            position: "{{ target_position | int }}"


        - delay:
            seconds: 3


      until:

        - condition: template
          value_template: >
            {{
              (
                (
                  state_attr(cover_entity, 'current_position')
                  | int(-999)
                )
                -
                (target_position | int)
              )
              | abs
              <= 2
              or
              repeat.index >= 10
            }}



# =============================================================================
# AUTOMATION MODE
# =============================================================================

mode: restart

max_exceeded: silent