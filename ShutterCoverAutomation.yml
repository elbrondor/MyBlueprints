# =============================================================================
# ShutterCoverAutomation_v6_DRAFT.yml
#
# VERSION: 6.0.0-DRAFT
#
# Features
# --------
#
# - Sunrise / Sunset
# - Workday Sensor
# - Feiertage über Workday Sensor
# - Früheste Öffnungszeiten
# - Türschutz
# - Verzögerung nach Türschließung
# - Manuelle Übersteuerung über Shelly Inputs
# - Kühlung
# - Azimutbasierte Beschattung
# - Globalbeschattung ab 28°C
# - Logbook Integration
# - Beschattung aufheben 1h vor Sonnenuntergang
#
# PRIORITÄTEN
#
# 1. Manual Override
# 2. Aussperrschutz
# 3. Globalbeschattung >= 28°C
# 4. Normale Beschattung
# 5. Sunrise / Sunset
#
# =============================================================================

blueprint:

  name: Shutter Cover Automation Enterprise v6

  description: >

    Enterprise Blueprint für Rollos:

    - Sunrise/Sunset
    - Workday Sensor
    - Holiday Support
    - Manual Override
    - Cooling
    - Global Shading
    - Azimuth Profiles
    - Logbook Integration

  domain: automation


# =============================================================================
# INPUTS
# =============================================================================

  input:

    cover_entity:
      name: Cover
      selector:
        entity:
          domain: cover

    workday_sensor:
      name: Workday Sensor
      selector:
        entity:
          domain: binary_sensor

    door_sensor:
      name: Door Sensor
      default: ""
      selector:
        entity:
          domain: binary_sensor

    weather_entity:
      name: Weather Entity
      selector:
        entity:
          domain: weather

    outdoor_temperature_sensor:
      name: Outdoor Temperature Sensor
      selector:
        entity:
          domain: sensor

    manual_override_entity_1:
      name: Manual Override Entity 1
      default: ""
      selector:
        entity: {}

    manual_override_entity_2:
      name: Manual Override Entity 2
      default: ""
      selector:
        entity: {}

    sunrise_offset:
      default: "00:00:00"
      selector:
        duration:

    sunset_offset:
      default: "00:00:00"
      selector:
        duration:

    earliest_weekday:
      default: "07:00:00"
      selector:
        time:

    earliest_weekend:
      default: "08:00:00"
      selector:
        time:

    door_close_delay:
      default: "00:05:00"
      selector:
        duration:

    cooling_position:
      default: 30
      selector:
        number:
          min: 0
          max: 100
          step: 1

    cooling_temperature:
      default: 24
      selector:
        number:
          min: 15
          max: 40
          step: 0.5

    global_shading_temperature:
      default: 28
      selector:
        number:
          min: 20
          max: 45
          step: 0.5

    azimuth_min:
      default: 135
      selector:
        number:
          min: 0
          max: 360
          step: 1

    azimuth_max:
      default: 225
      selector:
        number:
          min: 0
          max: 360
          step: 1

    minimum_elevation:
      default: 10
      selector:
        number:
          min: 0
          max: 90
          step: 1


# =============================================================================
# MODE
# =============================================================================

mode: restart


# =============================================================================
# VARIABLES
# =============================================================================

variables:

  cover_entity: !input cover_entity

  workday_sensor: !input workday_sensor

  weather_entity: !input weather_entity

  outdoor_temperature_sensor: !input outdoor_temperature_sensor

  door_sensor: !input door_sensor

  manual_override_entity_1: !input manual_override_entity_1

  manual_override_entity_2: !input manual_override_entity_2

  manual_override_active: >

    {% set t1 =
       as_timestamp(states[manual_override_entity_1].last_changed)
       if manual_override_entity_1 != ''
       else 0 %}

    {% set t2 =
       as_timestamp(states[manual_override_entity_2].last_changed)
       if manual_override_entity_2 != ''
       else 0 %}

    {% set latest = [t1,t2]|max %}

    {{ (as_timestamp(now()) - latest) < 900 }}

  is_workday: >

    {{ is_state(workday_sensor,'on') }}

  sun_azimuth: >

    {{ state_attr('sun.sun','azimuth') | float(0) }}

  sun_elevation: >

    {{ state_attr('sun.sun','elevation') | float(0) }}

  global_shading_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      28
    }}

  cooling_required: >

    {{
      states(outdoor_temperature_sensor)|float(0)
      >=
      24
    }}

  weather_ok: >

    {{
      states(weather_entity)
      in
      [
        'sunny',
        'clear',
        'partlycloudy'
      ]
    }}

# =============================================================================
# TRIGGERS
# =============================================================================

trigger:

  - platform: sun
    event: sunrise
    offset: !input sunrise_offset
    id: sunrise

  - platform: sun
    event: sunset
    offset: !input sunset_offset
    id: sunset

  - platform: sun
    event: sunset
    offset: "-01:00:00"
    id: cooling_release

  - platform: time
    at: !input earliest_weekday
    id: weekday_open

  - platform: time
    at: !input earliest_weekend
    id: weekend_open

  - platform: state
    entity_id: !input door_sensor
    id: door_changed

  - platform: state
    entity_id: !input outdoor_temperature_sensor
    id: temperature_changed

  - platform: state
    entity_id: !input weather_entity
    id: weather_changed

  - platform: state
    entity_id: !input manual_override_entity_1
    id: manual_override

  - platform: state
    entity_id: !input manual_override_entity_2
    id: manual_override

  - platform: time_pattern
    minutes: "/5"
    id: evaluation


# =============================================================================
# ACTIONS
# =============================================================================

action:

  - choose:

# -----------------------------------------------------------------------------
# MANUAL OVERRIDE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ manual_override_active }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Manual override active.
                Automatic actions suspended.

# -----------------------------------------------------------------------------
# GLOBAL SHADING
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ not manual_override_active }}

          - condition: template
            value_template: >
              {{ global_shading_required }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Global shading active.

          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input cooling_position

# -----------------------------------------------------------------------------
# NORMAL COOLING
# -----------------------------------------------------------------------------

      - conditions:

          - condition: template
            value_template: >
              {{ not manual_override_active }}

          - condition: template
            value_template: >
              {{ cooling_required }}

          - condition: template
            value_template: >
              {{ weather_ok }}

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Cooling active.

          - service: cover.set_cover_position
            target:
              entity_id: !input cover_entity
            data:
              position: !input cooling_position

# -----------------------------------------------------------------------------
# COOLING RELEASE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: cooling_release

        sequence:

          - service: logbook.log
            data:
              name: Shutter Automation
              message: >
                Cooling released one hour before sunset.

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# SUNRISE
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: sunrise

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# WEEKDAY OPEN
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: weekday_open

          - condition: state
            entity_id: !input workday_sensor
            state: "on"

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# WEEKEND OPEN
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: weekend_open

          - condition: state
            entity_id: !input workday_sensor
            state: "off"

        sequence:

          - service: cover.open_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# SUNSET
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: sunset

          - condition: template
            value_template: >

              {% if door_sensor != '' %}
                 {{ not is_state(door_sensor,'on') }}
              {% else %}
                 true
              {% endif %}

        sequence:

          - service: cover.close_cover
            target:
              entity_id: !input cover_entity

# -----------------------------------------------------------------------------
# DOOR CLOSED
# -----------------------------------------------------------------------------

      - conditions:

          - condition: trigger
            id: door_changed

          - condition: template
            value_template: >
              {{ not is_state(door_sensor,'on') }}

        sequence:

          - delay: !input door_close_delay

          - service: cover.close_cover
            target:
              entity_id: !input cover_entity

default: []
